<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U-05 식성 · v0.1 wireframe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Pretendard,system-ui,sans-serif}
.ic{border-radius:999px;border:1.5px solid #888;display:inline-flex;align-items:center;justify-content:center;color:#888;font-weight:500}
.chip{transition:.15s;position:relative}
.chip .mark{position:absolute;top:8px;right:8px;width:18px;height:18px;border:1.5px solid #888;border-radius:4px;background:#fff}
.chip.active{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
.chip.active .mark{background:#fff;border-color:#fff}
.chip.active .mark::after{content:'';position:absolute;top:2px;left:5px;width:4px;height:9px;border:solid #1f1f1f;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chip.active .ic{border-color:#fff;color:#fff}
.preview{border:1px dashed #999;border-radius:8px;padding:10px 12px;font-size:11px;color:#666;background:#fafafa;margin-bottom:16px}
.preview .cards{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.preview .card{background:#fff;border:1px solid #ccc;border-radius:6px;padding:3px 8px;font-size:10px}
.badge{display:inline-block;background:#f0f0f0;border:1px solid #ccc;border-radius:999px;padding:2px 10px;font-size:11px;color:#666}
.warn{background:#fff;border:1.5px solid #333;border-radius:8px;padding:8px 12px;font-size:11px;color:#333;margin-top:8px;display:flex;gap:8px;align-items:center}
</style>
</head>
<body class="bg-gray-200 text-gray-900 min-h-screen p-4 sm:p-8">
<a href="index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500">← v0.1 인덱스</a>
<div class="max-w-[420px] mx-auto bg-white rounded-3xl shadow overflow-hidden flex flex-col" style="min-height:844px">
  <div class="px-6 pt-6 pb-4 flex items-center justify-between">
    <a href="04-signup-shape.html" class="text-2xl text-gray-500">←</a>
    <span class="text-sm text-gray-500">4 / 7</span>
  </div>
  <div class="px-6">
    <div class="h-1 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-gray-900" style="width:57.1%"></div></div>
  </div>
  <div class="flex-1 px-6 pt-8 overflow-y-auto">
    <div class="ic mb-3" style="width:48px;height:48px;font-size:10px;border-width:2px">아이콘</div>
    <h1 class="text-2xl font-bold mb-2">음식은 어떠세요?</h1>
    <span class="badge mb-3 inline-block">□ 복수 선택 가능</span>
    <p class="text-gray-500 mb-4 text-sm">해당되는 것 모두 골라주세요.</p>

    <div class="preview">
      <div><strong>사용처</strong> · v0.1 신규</div>
      <div class="cards">
        <span class="card">메뉴 추천 제외 필터</span>
        <span class="card">알레르기 안전 마크</span>
      </div>
    </div>

    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">식이 성향</p>
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button class="chip bg-white border-2 border-gray-300 rounded-2xl p-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">채식</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-2xl p-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">비건</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-2xl p-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">페스코</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-2xl p-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">할랄</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-2xl p-3 text-left col-span-2">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">다 먹어요</div>
      </button>
    </div>

    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">알레르기 / 못 먹는 것</p>
    <div class="warn"><div class="ic" style="width:20px;height:20px;font-size:8px;border-width:1.5px">!</div><span><strong>건너뛰기 비권장</strong> — 알레르기 정보 누락 시 추천 안전성 보장 불가</span></div>
    <div class="grid grid-cols-2 gap-3 mt-3">
      <button class="chip bg-white border-2 border-gray-300 rounded-2xl p-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold leading-tight">견과류<br>알레르기</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-2xl p-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold leading-tight">갑각류<br>알레르기</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-2xl p-3 text-left col-span-2">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">유당 못 견딤</div>
      </button>
    </div>
  </div>
  <div class="px-6 py-4 border-t border-gray-200 grid grid-cols-3 gap-3">
    <a href="06-signup-lifestyle.html" class="col-span-1 bg-white border border-gray-300 text-gray-500 font-semibold py-3 rounded-xl text-center text-sm leading-tight">나중에 입력<div class="text-[10px] text-gray-400 mt-0.5">권장 안 함</div></a>
    <a href="06-signup-lifestyle.html" class="col-span-2 bg-gray-900 text-white font-semibold py-4 rounded-xl text-center">다음</a>
  </div>
</div>
<script>document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('active')))</script>
</body>
</html>
