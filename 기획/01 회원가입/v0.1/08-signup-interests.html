<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U-08 관심사 · v0.1 wireframe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Pretendard,system-ui,sans-serif}
.ic{border-radius:999px;border:1.5px solid #888;display:inline-flex;align-items:center;justify-content:center;color:#888;font-weight:500}
.chip{transition:.15s;position:relative}
.chip .mark{position:absolute;top:6px;right:6px;width:16px;height:16px;border:1.5px solid #888;border-radius:4px;background:#fff}
.chip.active{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
.chip.active .mark{background:#fff;border-color:#fff}
.chip.active .mark::after{content:'';position:absolute;top:1px;left:4px;width:4px;height:8px;border:solid #1f1f1f;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chip.active .ic{border-color:#fff;color:#fff}
.preview{border:1px dashed #999;border-radius:8px;padding:10px 12px;font-size:11px;color:#666;background:#fafafa;margin-bottom:12px}
.preview .cards{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.preview .card{background:#fff;border:1px solid #ccc;border-radius:6px;padding:3px 8px;font-size:10px}
.badge{display:inline-block;background:#f0f0f0;border:1px solid #ccc;border-radius:999px;padding:2px 10px;font-size:11px;color:#666}
.counter{font-size:11px;color:#666}
.counter strong{color:#1f1f1f}
</style>
</head>
<body class="bg-gray-200 text-gray-900 min-h-screen p-4 sm:p-8">
<a href="index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500">← v0.1 인덱스</a>
<div class="max-w-[420px] mx-auto bg-white rounded-3xl shadow overflow-hidden flex flex-col" style="min-height:844px">
  <div class="px-6 pt-6 pb-4 flex items-center justify-between">
    <a href="07-signup-job.html" class="text-2xl text-gray-500">←</a>
    <span class="text-sm text-gray-500">7 / 7</span>
  </div>
  <div class="px-6">
    <div class="h-1 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-gray-900" style="width:100%"></div></div>
  </div>
  <div class="flex-1 px-6 pt-8 overflow-y-auto">
    <div class="ic mb-3" style="width:48px;height:48px;font-size:10px;border-width:2px">아이콘</div>
    <h1 class="text-2xl font-bold mb-2">어떤 소식이 궁금하세요?</h1>
    <div class="flex items-center gap-2 mb-3">
      <span class="badge inline-block">□ 복수 선택</span>
      <span class="counter">최소 <strong>3개</strong> 권장 · 선택 <strong id="cnt">0</strong>개</span>
    </div>
    <p class="text-gray-500 mb-3 text-sm">관심 있는 분야 모두 골라주세요.</p>

    <div class="preview">
      <div><strong>사용처</strong> · v0.1 신규</div>
      <div class="cards">
        <span class="card">메인 헤드라인 필터</span>
        <span class="card">알림 키워드</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2.5" id="grid">
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">경제·시사</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">엔터·연예</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">스포츠</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">IT·테크</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">의료·헬스</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">패션·라이프</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">자기계발</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">육아·교육</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">음식·요리</div>
      </button>
      <button class="chip bg-white border-2 border-gray-300 rounded-xl px-3 py-3 text-left">
        <span class="mark"></span>
        <div class="ic mb-1" style="width:28px;height:28px;font-size:8px">아이콘</div>
        <div class="text-sm font-semibold">여행</div>
      </button>
    </div>
  </div>
  <div class="px-6 py-4 border-t border-gray-200 grid grid-cols-3 gap-3">
    <a href="index.html" class="col-span-1 bg-white border border-gray-300 text-gray-500 font-semibold py-3 rounded-xl text-center text-sm leading-tight">나중에 입력<div class="text-[10px] text-gray-400 mt-0.5">권장 안 함</div></a>
    <a href="index.html" class="col-span-2 bg-gray-900 text-white font-semibold py-4 rounded-xl text-center">완료</a>
  </div>
</div>
<script>
document.querySelectorAll('#grid .chip').forEach(c=>c.addEventListener('click',()=>{
  c.classList.toggle('active');
  document.getElementById('cnt').textContent = document.querySelectorAll('#grid .chip.active').length;
}));
</script>
</body>
</html>
