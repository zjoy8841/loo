<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U-01 Splash · v0.5 (그레이스케일)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Pretendard,system-ui,sans-serif}
.lc{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block;flex-shrink:0;vertical-align:middle}
.lc-14{width:14px;height:14px}.lc-18{width:18px;height:18px}.lc-22{width:22px;height:22px}

<body class="bg-gray-200 text-gray-900 min-h-screen p-4 sm:p-8">

<!-- ───── SVG line icon defs ───── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <symbol id="i-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>

<a href="index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500">← v0.5 인덱스</a>

<div class="max-w-[420px] mx-auto bg-white rounded-3xl shadow overflow-hidden flex flex-col" style="min-height:844px">
