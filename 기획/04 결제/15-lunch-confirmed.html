<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ivory: '#FAF7F0', charcoal: '#1F2937', mustard: '#F59E0B', lavender: '#8B5CF6' }, fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
  <style>
    @keyframes scale-in { 0% { transform: scale(0); } 60% { transform: scale(1.1);} 100% { transform: scale(1);} }
    .scale-in { animation: scale-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  </style>

<body class="bg-gray-100 text-charcoal font-sans min-h-screen p-4 sm:p-8">
  <a href="../index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500 hover:text-emerald-600">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto bg-ivory rounded-3xl shadow-xl overflow-hidden flex flex-col" style="min-height: 844px;">
    <div class="flex-1 flex flex-col items-center justify-center px-8 text-center">
      <div class="w-24 h-24 rounded-full bg-emerald-500 flex items-center justify-center text-5xl text-white mb-6 scale-in shadow-lg">✓</div>

            <span class="font-semibold">B카페 (강남점)</span>

      </div>
    </div>

    <div class="px-6 py-4 border-t border-gray-200 grid grid-cols-2 gap-3">
      <a href="07-home.html" class="bg-white border border-gray-200 text-charcoal font-semibold py-3.5 rounded-xl text-center">홈으로</a>
      <a href="#" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3.5 rounded-xl text-center transition">길찾기</a>

</html>
