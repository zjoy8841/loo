<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-11 AI 비서 · Trendy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: '#0A0A0F', mist: '#FAFAFA', cyber: '#06B6D4', grape: '#8B5CF6', magenta: '#EC4899' }, fontFamily: { sans: ['Pretendard Variable', 'system-ui', 'sans-serif'] } } } }
  </script>
  <style>
    .grad-bg { background: radial-gradient(at 50% 30%, rgba(236,72,153,0.4) 0%, transparent 60%), radial-gradient(at 30% 70%, rgba(139,92,246,0.35) 0%, transparent 60%), radial-gradient(at 70% 70%, rgba(6,182,212,0.3) 0%, transparent 60%), #0A0A0F; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(236,72,153,0.6), 0 0 60px rgba(139,92,246,0.5); transform: scale(1); }
      70% { box-shadow: 0 0 0 60px rgba(236,72,153,0), 0 0 100px rgba(139,92,246,0.7); transform: scale(1.04); }
      100% { box-shadow: 0 0 0 0 rgba(236,72,153,0), 0 0 60px rgba(139,92,246,0.5); transform: scale(1); }
    }
    .pulse-ring { animation: pulse-ring 2.4s infinite ease-out; }
    @keyframes wave { 0%,100% { height: 14%; } 50% { height: 100%; } }
    .wave-bar { animation: wave 1s infinite ease-in-out; transform-origin: bottom; }
    .wave-bar:nth-child(1),.wave-bar:nth-child(11) { animation-delay: 0s; }
    .wave-bar:nth-child(2),.wave-bar:nth-child(10) { animation-delay: 0.1s; }
    .wave-bar:nth-child(3),.wave-bar:nth-child(9) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4),.wave-bar:nth-child(8) { animation-delay: 0.3s; }
    .wave-bar:nth-child(5),.wave-bar:nth-child(7) { animation-delay: 0.4s; }
    .wave-bar:nth-child(6) { animation-delay: 0.5s; }
    @keyframes fade-up { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fade-up 0.5s ease-out; }
  </style>
</head>
<body class="bg-gray-950 text-mist font-sans">
  <a href="../index.html" class="block max-w-[420px] mx-auto pt-4 px-4 text-sm text-white/40 hover:text-cyber">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto rounded-[3rem] overflow-hidden flex flex-col grad-bg relative" style="min-height: 844px;">

    <header class="px-5 pt-8 pb-4 flex items-center gap-3">
      <a href="09-home.html" class="w-11 h-11 rounded-full glass flex items-center justify-center text-lg">✕</a>
      <div>
        <p class="text-[10px] font-black uppercase tracking-widest text-white/50">AI ASSISTANT</p>
        <p class="text-sm font-bold">Lo</p>
      </div>
      <button class="ml-auto w-11 h-11 rounded-full glass flex items-center justify-center text-base" title="텍스트 입력">⌨️</button>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center px-8 pb-8">

      <p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/60 mb-6 fade-up">LISTENING...</p>

      <div class="relative mb-12">
        <div class="w-52 h-52 rounded-full pulse-ring flex items-center justify-center" style="background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 50%, #06B6D4 100%)">
          <div class="w-36 h-36 rounded-full bg-ink/40 backdrop-blur-xl flex items-end justify-center gap-1 px-7 py-9">
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
            <span class="wave-bar w-1.5 bg-white rounded-full"></span>
          </div>
        </div>
      </div>

      <div class="text-center min-h-[120px]">
        <p class="text-3xl font-black leading-tight fade-up">"오늘 점심<br/>뭐 먹지?"</p>
        <p class="text-xs text-white/40 mt-4 font-bold uppercase tracking-widest">실시간 인식 중</p>
      </div>

      <div class="mt-12 grid grid-cols-2 gap-2.5 w-full max-w-sm">
        <div class="glass rounded-2xl px-4 py-3 text-center">
          <p class="text-[9px] text-white/40 uppercase tracking-widest mb-1 font-black">TRY</p>
          <p class="text-xs font-bold">"내일 일정"</p>
        </div>
        <div class="glass rounded-2xl px-4 py-3 text-center">
          <p class="text-[9px] text-white/40 uppercase tracking-widest mb-1 font-black">TRY</p>
          <p class="text-xs font-bold">"가벼운 운동"</p>
        </div>
      </div>
    </div>

    <div class="px-5 py-5 border-t border-white/5 backdrop-blur flex items-center justify-around">
      <button class="flex flex-col items-center gap-1 text-white/40 hover:text-mist transition">
        <span class="text-xl">🌐</span>
        <span class="text-[10px] font-black uppercase tracking-wider">번역</span>
      </button>
      <a href="09-home.html" class="w-16 h-16 rounded-full bg-mist text-magenta flex items-center justify-center text-2xl shadow-2xl shadow-magenta/30 active:scale-95 transition" title="종료">⏹</a>
      <button class="flex flex-col items-center gap-1 text-white/40 hover:text-mist transition">
        <span class="text-xl">🔇</span>
        <span class="text-[10px] font-black uppercase tracking-wider">음소거</span>
      </button>
    </div>
  </div>
</body>
</html>
