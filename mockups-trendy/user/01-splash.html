<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-01 Splash · Trendy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: '#0A0A0F', mist: '#FAFAFA', cyber: '#06B6D4', grape: '#8B5CF6', magenta: '#EC4899' }, fontFamily: { sans: ['Pretendard Variable', 'system-ui', 'sans-serif'] } } } }
  </script>
  <style>
    .grad-bg { background: radial-gradient(at 30% 20%, rgba(139,92,246,0.4) 0%, transparent 50%), radial-gradient(at 70% 80%, rgba(6,182,212,0.35) 0%, transparent 50%), radial-gradient(at 50% 50%, rgba(236,72,153,0.15) 0%, transparent 60%), #0A0A0F; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); }
    @keyframes float-logo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .float-logo { animation: float-logo 4s ease-in-out infinite; }
    @keyframes glow {
      0%,100% { box-shadow: 0 0 60px rgba(139,92,246,0.5), 0 0 120px rgba(6,182,212,0.3); }
      50% { box-shadow: 0 0 100px rgba(139,92,246,0.7), 0 0 200px rgba(6,182,212,0.4); }
    }
    .glow { animation: glow 3s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gray-950 text-mist font-sans">
  <a href="../index.html" class="block max-w-[420px] mx-auto pt-4 px-4 text-sm text-white/40 hover:text-cyber">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto rounded-[3rem] overflow-hidden flex flex-col grad-bg" style="min-height: 844px;">
    <div class="flex-1 flex flex-col items-center justify-center px-8 relative">
      <div class="absolute top-12 right-8 text-xs font-mono text-white/30 tracking-widest">v1.0 · 2026</div>

      <div class="w-32 h-32 rounded-[2rem] flex items-center justify-center text-white font-black text-7xl mb-10 float-logo glow" style="background: linear-gradient(135deg, #06B6D4 0%, #8B5CF6 50%, #EC4899 100%)">L</div>

      <h1 class="text-5xl font-black text-center mb-4 tracking-tight leading-none">
        Life OS<br/>
        <span class="bg-gradient-to-r from-cyber via-grape to-magenta bg-clip-text text-transparent">.ONE</span>
      </h1>

      <p class="text-white/60 text-center text-base leading-relaxed font-medium max-w-[280px]">
        내 일상이 알아서<br/>흘러가는 운영체계
      </p>

      <div class="mt-12 flex gap-2 items-center">
        <span class="w-2 h-2 rounded-full bg-cyber"></span>
        <span class="w-2 h-2 rounded-full bg-grape"></span>
        <span class="w-2 h-2 rounded-full bg-magenta"></span>
      </div>
    </div>

    <div class="px-6 pb-10 space-y-3">
      <a href="02-signup-account.html" class="block w-full text-center py-5 rounded-2xl font-black text-lg text-white relative overflow-hidden group" style="background: linear-gradient(135deg, #06B6D4 0%, #8B5CF6 100%)">
        <span class="relative z-10">3분 만에 시작 →</span>
        <div class="absolute inset-0 bg-white/0 group-hover:bg-white/10 transition"></div>
      </a>
      <button class="w-full py-4 rounded-2xl glass font-bold text-mist hover:bg-white/10 transition">
        이미 계정 있어요
      </button>
      <p class="text-center text-xs text-white/30 mt-4">시작하면 <span class="text-white/60 underline">이용약관</span>·<span class="text-white/60 underline">개인정보 처리방침</span>에 동의</p>
    </div>
  </div>
</body>
</html>
