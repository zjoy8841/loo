<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-12 🌙 저녁 시나리오 (P1)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ivory: '#FAF7F0', charcoal: '#1F2937', mustard: '#F59E0B', lavender: '#8B5CF6' }, fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-gray-100 text-charcoal font-sans min-h-screen p-4 sm:p-8">
  <a href="../index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500 hover:text-emerald-600">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto bg-ivory rounded-3xl shadow-xl overflow-hidden flex flex-col" style="min-height: 844px;">
    <div class="px-6 pt-6 pb-4 flex items-center gap-3 border-b border-gray-100">
      <a href="07-home.html" class="text-2xl text-gray-500">←</a>
      <div class="w-2 h-2 rounded-full bg-lavender"></div>
      <h1 class="font-bold">🌙 저녁 마무리</h1>
      <span class="ml-auto text-xs text-gray-500 font-mono">19:00</span>
    </div>

    <div class="flex-1 px-6 py-5 space-y-4 overflow-y-auto">
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xl">🚶</span>
          <h3 class="font-bold">오늘 활동량</h3>
        </div>
        <div class="flex items-baseline gap-2 mb-3">
          <span class="text-3xl font-bold">5,200</span>
          <span class="text-gray-500 text-sm">걸음 / 목표 7,000</span>
        </div>
        <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
          <div class="h-full bg-lavender rounded-full" style="width: 74%"></div>
        </div>
        <p class="text-xs text-gray-500 mt-3">목표까지 1,800걸음 더 필요해요</p>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h3 class="font-bold mb-1">누구와 함께 드실 건가요?</h3>
        <p class="text-xs text-gray-500 mb-4">분위기에 맞는 메뉴를 추천해드려요</p>
        <div class="grid grid-cols-3 gap-2">
          <button class="py-3 bg-lavender text-white rounded-xl text-sm font-semibold">🧘‍♂️ 혼자</button>
          <button class="py-3 bg-white border border-gray-200 rounded-xl text-sm">👨‍👩‍👧 가족·친구</button>
          <button class="py-3 bg-white border border-gray-200 rounded-xl text-sm">🍻 회식</button>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <div class="aspect-video bg-gradient-to-br from-amber-100 to-orange-200 flex items-center justify-center text-5xl">🍜</div>
        <div class="p-5">
          <h3 class="font-bold">조용한 C식당 우동 한 그릇</h3>
          <p class="text-xs text-gray-500 mt-0.5">도보 4분 · 점심과 안 겹치는 따뜻한 한 끼</p>
          <div class="flex gap-1.5 mt-2">
            <span class="px-2 py-0.5 bg-orange-50 text-orange-700 text-xs rounded font-semibold">380kcal</span>
            <span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 text-xs rounded font-semibold">저자극</span>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xl">🏃</span>
          <h3 class="font-bold">내일은 가볍게 움직여볼까요?</h3>
        </div>
        <div class="bg-lavender/10 rounded-xl p-4 flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-lavender flex items-center justify-center text-2xl">🌅</div>
          <div class="flex-1">
            <p class="font-semibold text-sm">아침 산책 30분</p>
            <p class="text-xs text-gray-500 mt-0.5">한강공원 · 출근 전</p>
          </div>
          <button class="px-3 py-1.5 bg-lavender text-white text-xs font-semibold rounded-lg">추가</button>
        </div>
      </div>
    </div>

    <nav class="px-6 py-4 border-t border-gray-200 flex justify-around text-xs text-gray-500">
      <button class="flex flex-col items-center gap-1"><span class="text-xl">🏠</span><span>홈</span></button>
      <button class="flex flex-col items-center gap-1"><span class="text-xl">📊</span><span>기록</span></button>
      <button class="flex flex-col items-center gap-1"><span class="text-xl">👤</span><span>마이</span></button>
    </nav>
  </div>
</body>
</html>
