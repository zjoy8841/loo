<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-04 회원가입 3/7 · 체형·목표</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ivory: '#FAF7F0', charcoal: '#1F2937', mustard: '#F59E0B', lavender: '#8B5CF6' }, fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
  <style>
    .chip { transition: all 0.15s; }
    .chip.active { background: #10B981; color: white; border-color: #10B981; }
  </style>
</head>
<body class="bg-gray-100 text-charcoal font-sans min-h-screen p-4 sm:p-8">
  <a href="../index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500 hover:text-emerald-600">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto bg-ivory rounded-3xl shadow-xl overflow-hidden flex flex-col" style="min-height: 844px;">
    <div class="px-6 pt-6 pb-4 flex items-center justify-between">
      <a href="03-signup-health.html" class="text-2xl text-gray-500">←</a>
      <span class="text-sm text-gray-500">3 / 7</span>
    </div>
    <div class="px-6">
      <div class="h-1 bg-gray-200 rounded-full overflow-hidden">
        <div class="h-full w-3/7 bg-emerald-500"></div>
      </div>
    </div>

    <div class="flex-1 px-6 pt-10">
      <div class="text-3xl mb-3">🎯</div>
      <h1 class="text-2xl font-bold mb-2">요즘 체형 목표는요?</h1>
      <p class="text-gray-500 mb-8 text-sm">하나만 골라주세요. 메뉴 추천에 활용돼요.</p>

      <div class="grid grid-cols-2 gap-3">
        <button class="chip bg-white border-2 border-gray-200 rounded-2xl p-4 text-left">
          <div class="text-2xl mb-1.5">🚩</div>
          <div class="text-sm font-semibold leading-tight">살찌고<br>싶어요</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-2xl p-4 text-left">
          <div class="text-2xl mb-1.5">🏃‍♀️</div>
          <div class="text-sm font-semibold leading-tight">다이어트<br>중</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-2xl p-4 text-left">
          <div class="text-2xl mb-1.5">💪</div>
          <div class="text-sm font-semibold leading-tight">벌크업<br>중</div>
        </button>
        <button class="chip active bg-white border-2 border-gray-200 rounded-2xl p-4 text-left">
          <div class="text-2xl mb-1.5">♾️</div>
          <div class="text-sm font-semibold leading-tight">네버엔딩<br>다이어터</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-2xl p-4 text-left col-span-2">
          <div class="text-2xl mb-1.5">🧘</div>
          <div class="text-sm font-semibold leading-tight">그냥 유지만 할래요</div>
        </button>
      </div>
    </div>

    <div class="px-6 py-4 border-t border-gray-200 grid grid-cols-3 gap-3">
      <a href="05-signup-diet.html" class="col-span-1 bg-white border border-gray-200 text-gray-500 font-semibold py-4 rounded-xl text-center">건너뛰기</a>
      <a href="05-signup-diet.html" class="col-span-2 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-4 rounded-xl text-center transition">다음</a>
    </div>
  </div>

  <script>
    document.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', () => c.classList.toggle('active'));
    });
  </script>
</body>
</html>
