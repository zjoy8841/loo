<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-10 점심 · 더미 결제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ivory: '#FAF7F0', charcoal: '#1F2937', mustard: '#F59E0B', lavender: '#8B5CF6' }, fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-gray-100 text-charcoal font-sans min-h-screen p-4 sm:p-8">
  <a href="../index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500 hover:text-emerald-600">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto bg-ivory rounded-3xl shadow-xl overflow-hidden flex flex-col relative" style="min-height: 844px;">
    <div class="absolute inset-0 pointer-events-none flex items-center justify-center" style="z-index:0;">
      <div class="text-[120px] font-black text-gray-200/80 -rotate-12 select-none">DEMO</div>
    </div>

    <div class="relative px-6 pt-6 pb-4 flex items-center gap-3 border-b border-gray-100 bg-ivory">
      <a href="09-lunch-chat.html" class="text-2xl text-gray-500">✕</a>
      <h1 class="font-bold">결제</h1>
      <span class="ml-auto px-2 py-0.5 bg-mustard text-white text-xs rounded-full font-bold">DEMO</span>
    </div>

    <div class="relative flex-1 px-6 pt-5 overflow-y-auto bg-ivory">
      <div class="bg-white rounded-2xl p-4 shadow-sm mb-5">
        <div class="flex gap-3">
          <div class="w-14 h-14 rounded-xl bg-emerald-100 flex items-center justify-center text-2xl">🥗</div>
          <div class="flex-1">
            <h3 class="font-bold text-sm">닭가슴살 샐러드 세트</h3>
            <p class="text-xs text-gray-500 mt-0.5">B카페 · 12:30 예약</p>
            <p class="font-bold mt-1">8,500원</p>
          </div>
        </div>
      </div>

      <h3 class="text-sm font-bold mb-3">카드 정보</h3>
      <div class="bg-white rounded-2xl p-5 shadow-sm space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1.5">카드 번호</label>
          <input type="text" placeholder="1234 5678 9012 3456" class="w-full bg-ivory rounded-lg px-3 py-2.5 text-sm border border-gray-200 focus:outline-none focus:border-emerald-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1.5">유효기간</label>
            <input type="text" placeholder="MM / YY" class="w-full bg-ivory rounded-lg px-3 py-2.5 text-sm border border-gray-200 focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1.5">CVC</label>
            <input type="text" placeholder="123" class="w-full bg-ivory rounded-lg px-3 py-2.5 text-sm border border-gray-200 focus:outline-none focus:border-emerald-500" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1.5">카드 소유자</label>
          <input type="text" placeholder="HONG GIL DONG" class="w-full bg-ivory rounded-lg px-3 py-2.5 text-sm border border-gray-200 focus:outline-none focus:border-emerald-500" />
        </div>
      </div>

      <div class="mt-5 bg-mustard/10 border border-mustard/30 rounded-xl p-3 flex gap-2">
        <span class="text-mustard">⚠️</span>
        <p class="text-xs text-mustard leading-relaxed">데모 환경입니다. 실제 결제는 일어나지 않으며 입력하신 카드 정보도 저장되지 않아요.</p>
      </div>

      <div class="mt-4 mb-4 flex justify-between items-center">
        <span class="text-sm text-gray-500">결제 금액</span>
        <span class="text-2xl font-bold">8,500원</span>
      </div>
    </div>

    <div class="relative px-6 py-4 border-t border-gray-200 bg-white">
      <a href="15-lunch-confirmed.html" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-4 rounded-xl text-center transition">결제하기 (DEMO)</a>
    </div>
  </div>
</body>
</html>
