<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-08 🌅 아침 시나리오</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ivory: '#FAF7F0', charcoal: '#1F2937', mustard: '#F59E0B', lavender: '#8B5CF6' }, fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
  <style>
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5);} 70% { box-shadow: 0 0 0 16px rgba(245,158,11,0);} 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0);} }
    .pulse-ring { animation: pulse-ring 1.6s infinite; }
    @keyframes wave { 0%,100% { transform: scaleY(0.4);} 50% { transform: scaleY(1);} }
    .wave-bar { animation: wave 1s infinite; transform-origin: center; }
    .wave-bar:nth-child(2){ animation-delay: 0.15s }
    .wave-bar:nth-child(3){ animation-delay: 0.3s }
    .wave-bar:nth-child(4){ animation-delay: 0.45s }
  </style>
</head>
<body class="bg-gray-100 text-charcoal font-sans min-h-screen p-4 sm:p-8">
  <a href="../index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500 hover:text-emerald-600">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto bg-ivory rounded-3xl shadow-xl overflow-hidden flex flex-col relative" style="min-height: 844px;">
    <div class="px-6 pt-6 pb-4 flex items-center gap-3 border-b border-gray-100">
      <a href="07-home.html" class="text-2xl text-gray-500">←</a>
      <div class="w-2 h-2 rounded-full bg-mustard"></div>
      <h1 class="font-bold">🌅 아침 브리핑</h1>
      <span class="ml-auto text-xs text-gray-500 font-mono">7:30</span>
    </div>

    <div class="px-6 pt-4 pb-3">
      <div class="bg-mustard/10 border border-mustard/30 rounded-xl p-3 flex items-center gap-3 text-sm">
        <span>🔔</span>
        <span class="flex-1 text-mustard"><strong>오전 7:30</strong> · 알림을 확인했어요</span>
      </div>
    </div>

    <div class="flex-1 px-6 pt-4 space-y-4 overflow-y-auto">
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xl">☁️</span>
          <h3 class="font-bold">오늘 날씨</h3>
        </div>
        <div class="flex items-baseline gap-2 mb-2">
          <span class="text-4xl font-bold">14°</span>
          <span class="text-gray-500 text-sm">최저 7° · 최고 22°</span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-xs">
          <div class="bg-gray-50 rounded-lg py-2">
            <div class="text-gray-500">강수</div>
            <div class="font-bold text-blue-500">80%</div>
          </div>
          <div class="bg-gray-50 rounded-lg py-2">
            <div class="text-gray-500">바람</div>
            <div class="font-bold">3m/s</div>
          </div>
          <div class="bg-gray-50 rounded-lg py-2">
            <div class="text-gray-500">미세먼지</div>
            <div class="font-bold text-emerald-600">보통</div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xl">📅</span>
          <h3 class="font-bold">오늘 일정</h3>
        </div>
        <div class="space-y-3 text-sm">
          <div class="flex gap-3">
            <span class="text-gray-500 font-mono text-xs pt-1 w-10">09:00</span>
            <span>출근</span>
          </div>
          <div class="flex gap-3">
            <span class="text-mustard font-mono text-xs pt-1 w-10 font-bold">14:00</span>
            <span class="font-semibold">클라이언트 미팅 (디자인 리뷰)</span>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xl">👔</span>
          <h3 class="font-bold">옷차림 추천</h3>
        </div>
        <p class="text-sm text-charcoal leading-relaxed">기온차 큰 날이에요. <strong>가벼운 옷차림에 미팅용 자켓</strong>을 챙기세요. 비 확률 높으니 <strong>우산 필수</strong>예요.</p>
        <div class="flex gap-2 mt-3 flex-wrap">
          <span class="px-3 py-1 bg-mustard/10 text-mustard text-xs rounded-full font-semibold">🧥 자켓</span>
          <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs rounded-full font-semibold">☂️ 우산</span>
          <span class="px-3 py-1 bg-gray-100 text-gray-700 text-xs rounded-full font-semibold">👞 편한 신발</span>
        </div>
      </div>
    </div>

    <div class="px-6 py-4 border-t border-gray-200 bg-white">
      <div class="flex items-center gap-3 bg-mustard/10 rounded-2xl px-4 py-3">
        <div class="w-10 h-10 rounded-full bg-mustard flex items-center justify-center pulse-ring">
          <span class="text-white text-xl">🔊</span>
        </div>
        <div class="flex items-end gap-1 h-6 flex-1">
          <div class="wave-bar w-1 h-full bg-mustard rounded-full"></div>
          <div class="wave-bar w-1 h-full bg-mustard rounded-full"></div>
          <div class="wave-bar w-1 h-full bg-mustard rounded-full"></div>
          <div class="wave-bar w-1 h-full bg-mustard rounded-full"></div>
          <div class="wave-bar w-1 h-full bg-mustard rounded-full"></div>
        </div>
        <span class="text-xs text-mustard font-semibold">AI 안내 중...</span>
      </div>
      <p class="text-center text-xs text-gray-400 mt-3">"오늘 아침 기온은 7도, 낮 최고 22도예요. 클라이언트 미팅 있으니..."</p>
    </div>
  </div>
</body>
</html>
