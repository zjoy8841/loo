<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-08 회원가입 7/7 · 관심 분야</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ivory: '#FAF7F0', charcoal: '#1F2937', mustard: '#F59E0B', lavender: '#8B5CF6' }, fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
  <style>
    .chip { transition: all 0.15s; }
    .chip.active { background: #10B981; color: white; border-color: #10B981; }
  </style>
</head>
<body class="bg-gray-100 text-charcoal font-sans min-h-screen p-4 sm:p-8">
  <a href="../index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500 hover:text-emerald-600">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto bg-ivory rounded-3xl shadow-xl overflow-hidden flex flex-col" style="min-height: 844px;">
    <div class="px-6 pt-6 pb-4 flex items-center justify-between">
      <a href="07-signup-job.html" class="text-2xl text-gray-500">←</a>
      <span class="text-sm text-gray-500">7 / 7</span>
    </div>
    <div class="px-6">
      <div class="h-1 bg-gray-200 rounded-full overflow-hidden">
        <div class="h-full w-full bg-emerald-500"></div>
      </div>
    </div>

    <div class="flex-1 px-6 pt-10 overflow-y-auto">
      <div class="text-3xl mb-3">🎯</div>
      <h1 class="text-2xl font-bold mb-2">어떤 소식이 궁금하세요?</h1>
      <p class="text-gray-500 mb-8 text-sm leading-relaxed">관심 있는 분야 모두 골라주세요. 메인 화면의 헤드라인에 반영돼요.</p>

      <div class="grid grid-cols-2 gap-2.5">
        <button class="chip active bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">📈</div>
          <div class="text-sm font-semibold">경제·시사</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">🎬</div>
          <div class="text-sm font-semibold">엔터·연예</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">⚽</div>
          <div class="text-sm font-semibold">스포츠</div>
        </button>
        <button class="chip active bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">💻</div>
          <div class="text-sm font-semibold">IT·테크</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">🩺</div>
          <div class="text-sm font-semibold">의료·헬스</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">👗</div>
          <div class="text-sm font-semibold">패션·라이프</div>
        </button>
        <button class="chip active bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">📚</div>
          <div class="text-sm font-semibold">자기계발</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">👶</div>
          <div class="text-sm font-semibold">육아·교육</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">🍜</div>
          <div class="text-sm font-semibold">음식·요리</div>
        </button>
        <button class="chip bg-white border-2 border-gray-200 rounded-xl px-3 py-3 text-left">
          <div class="text-xl mb-1">✈️</div>
          <div class="text-sm font-semibold">여행</div>
        </button>
      </div>

      <div class="bg-emerald-50 rounded-2xl px-4 py-3 flex gap-3 items-start mt-6">
        <span class="text-xl">🎉</span>
        <p class="text-sm text-emerald-700 leading-relaxed">완료! 이제 다환님만의 라이프 OS가 시작돼요.</p>
      </div>
    </div>

    <div class="px-6 py-4 border-t border-gray-200 grid grid-cols-3 gap-3">
      <a href="09-home.html" class="col-span-1 bg-white border border-gray-200 text-gray-500 font-semibold py-4 rounded-xl text-center">건너뛰기</a>
      <a href="09-home.html" class="col-span-2 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-4 rounded-xl text-center transition">완료</a>
    </div>
  </div>

  <script>
    document.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', () => c.classList.toggle('active'));
    });
  </script>
</body>
</html>
