<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>라이언 디자인 데모 — 시점 · 음성</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #050810; color: white; overflow: hidden;
    font-family: 'Pretendard Variable', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --lion: #E87A3E;
    --lion-glow: #F4B860;
    --teal: #4FD1C5;
    --cyan: #00D4FF;
    --grid: rgba(79,209,197,0.06);
  }

  /* 모드 토글 (상단) */
  .mode-switch {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px;
    background: rgba(0,30,60,0.6); backdrop-filter: blur(12px);
    border: 1px solid rgba(79,209,197,0.3);
    padding: 6px; border-radius: 999px;
    z-index: 100;
  }
  .mode-btn {
    border: 0; background: transparent; cursor: pointer;
    padding: 8px 16px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: white;
    font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .mode-btn:hover { background: rgba(79,209,197,0.15); }
  .mode-btn.active { background: var(--teal); color: #050810; box-shadow: 0 0 16px rgba(79,209,197,0.4); }

  /* 도움말 (우상단) */
  .help {
    position: fixed; top: 18px; right: 18px;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(0,30,60,0.5); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7); font-size: 11px; font-weight: 600;
    z-index: 100; pointer-events: none;
  }

  /* ─────────── 공통: stage 베이스 ─────────── */
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .stage[hidden] { display: none; }

  /* ============================================== */
  /* ===========   MODE A: 시점 시나리오   ========= */
  /* ============================================== */

  /* 시점 배경 */
  .scene-stage.rainy {
    background: linear-gradient(160deg, #4A5568 0%, #2D3748 50%, #1A202C 100%);
  }
  .scene-stage.rainy .scene-bg::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 60%, rgba(120,150,180,0.35) 0%, transparent 65%),
      radial-gradient(ellipse at 80% 30%, rgba(80,100,130,0.25) 0%, transparent 50%);
    pointer-events: none;
  }
  .rain-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .drop {
    position: absolute; width: 1px;
    background: linear-gradient(180deg, transparent 0%, rgba(220,235,250,0.6) 50%, rgba(220,235,250,0.9) 100%);
    animation: drop-fall linear infinite;
    will-change: transform;
  }
  @keyframes drop-fall {
    0%   { transform: translate3d(0, -120px, 0); }
    100% { transform: translate3d(-30px, 110vh, 0); }
  }
  .splash {
    position: absolute; bottom: 0; width: 4px; height: 4px; border-radius: 50%;
    background: rgba(220,235,250,0.4);
    animation: splash-pulse ease-out infinite; will-change: transform, opacity;
  }
  @keyframes splash-pulse {
    0%   { transform: scale(0); opacity: 0.8; }
    100% { transform: scale(4); opacity: 0; }
  }

  .scene-stage.sunny {
    background: linear-gradient(160deg, #FED7AA 0%, #FB923C 35%, #EA580C 70%, #7C2D12 100%);
  }
  .sun {
    position: absolute; top: 14%; right: 12%;
    width: 100px; height: 100px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,253,230,1) 0%, rgba(252,211,77,0.8) 40%, rgba(255,154,0,0.3) 70%, transparent 100%);
    animation: sun-pulse 4s ease-in-out infinite;
    box-shadow: 0 0 80px rgba(255,237,213,0.8), 0 0 160px rgba(255,200,100,0.5);
  }
  @keyframes sun-pulse {
    0%, 100% { transform: scale(1); opacity: 0.95; }
    50%      { transform: scale(1.08); opacity: 1; }
  }
  .ray {
    position: absolute; top: 15%; right: 14%;
    width: 200px; height: 200px;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,237,213,0.15) 30deg, transparent 60deg, rgba(255,237,213,0.15) 90deg, transparent 120deg, rgba(255,237,213,0.15) 150deg, transparent 180deg, rgba(255,237,213,0.15) 210deg, transparent 240deg, rgba(255,237,213,0.15) 270deg, transparent 300deg, rgba(255,237,213,0.15) 330deg, transparent 360deg);
    border-radius: 50%;
    animation: rotate 30s linear infinite;
  }
  @keyframes rotate { 100% { transform: rotate(360deg); } }
  .cloud {
    position: absolute; width: 120px; height: 30px; border-radius: 50px;
    background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.4) 100%);
    animation: cloud-drift linear infinite; filter: blur(2px);
  }
  .cloud::before { content: ''; position: absolute; left: 20px; top: -20px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.7); }
  .cloud::after { content: ''; position: absolute; right: 25px; top: -15px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.6); }
  @keyframes cloud-drift {
    0%   { transform: translateX(-150px); }
    100% { transform: translateX(calc(100vw + 150px)); }
  }

  .scene-stage.lunch {
    background:
      radial-gradient(ellipse at center, rgba(150,90,50,0.5) 0%, transparent 60%),
      linear-gradient(135deg, #78350F 0%, #451A03 50%, #1C1917 100%);
  }
  .plate {
    position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
    width: 240px; height: 240px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, #65A30D 0%, #4D7C0F 25%, transparent 38%),
      radial-gradient(circle at 70% 50%, #DC2626 0%, transparent 22%),
      radial-gradient(circle at 50% 75%, #F59E0B 0%, transparent 28%),
      radial-gradient(circle at 20% 70%, #65A30D 0%, transparent 18%),
      radial-gradient(ellipse at center, #2A1810 0%, #1C1108 70%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 -20px 40px rgba(0,0,0,0.4);
    animation: plate-breathe 5s ease-in-out infinite;
  }
  @keyframes plate-breathe {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50%      { transform: translateX(-50%) scale(1.02); }
  }
  .steam {
    position: absolute; top: 28%; left: 50%; transform: translateX(-50%);
    width: 100px; height: 80px;
    background: radial-gradient(ellipse at center bottom, rgba(255,255,255,0.4) 0%, transparent 60%);
    filter: blur(8px);
    animation: steam-rise ease-in-out infinite;
  }
  @keyframes steam-rise {
    0%   { transform: translateX(-50%) translateY(0) scale(0.8); opacity: 0.6; }
    100% { transform: translateX(-50%) translateY(-60px) scale(1.3); opacity: 0; }
  }

  .scene-stage.evening {
    background: linear-gradient(180deg, #DC2626 0%, #9F1239 25%, #5B21B6 50%, #1E1B4B 80%, #0F0C29 100%);
    animation: evening-shift 8s ease-in-out infinite;
  }
  @keyframes evening-shift {
    0%, 100% { filter: hue-rotate(0deg) brightness(1); }
    50%      { filter: hue-rotate(-8deg) brightness(0.95); }
  }
  .city {
    position: absolute; bottom: 22%; left: 0; right: 0; height: 30%;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.7) 100%);
    clip-path: polygon(0 60%, 8% 40%, 14% 55%, 22% 30%, 32% 50%, 40% 35%, 50% 55%, 58% 25%, 68% 50%, 78% 35%, 88% 55%, 100% 30%, 100% 100%, 0 100%);
  }
  .windows { position: absolute; bottom: 22%; left: 0; right: 0; height: 30%; pointer-events: none; }
  .window {
    position: absolute; width: 3px; height: 3px; background: #FCD34D; border-radius: 1px;
    animation: window-flicker ease-in-out infinite;
    box-shadow: 0 0 6px rgba(252,211,77,0.6);
  }
  @keyframes window-flicker {
    0%, 90%, 100% { opacity: 1; }
    95% { opacity: 0.3; }
  }

  .scene-stage.night {
    background: linear-gradient(180deg, #0F0C29 0%, #1E1B4B 30%, #312E81 50%, #1E1B4B 80%, #0A0A0F 100%);
  }
  .star { position: absolute; border-radius: 50%; background: white; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.4); }
  }
  .moon {
    position: absolute; top: 12%; right: 18%;
    width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #F5F5DC 0%, #D6D5B8 60%, #9CA08F 100%);
    box-shadow: 0 0 40px rgba(245,245,220,0.4), 0 0 80px rgba(245,245,220,0.2);
  }

  /* 시점 UI 오버레이 */
  .scene-ui {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.55) 0%,
      transparent 25%,
      transparent 55%,
      rgba(0,0,0,0.85) 100%);
  }
  .scene-ui > * { pointer-events: auto; }
  .status-bar {
    position: absolute; top: 18px; left: 32px; right: 32px;
    display: flex; justify-content: space-between;
    font-size: 14px; font-weight: 700; color: white;
  }
  .moment-label {
    position: absolute; top: 80px; left: 32px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.85);
    display: flex; align-items: center; gap: 10px;
  }
  .moment-label::before { content: ''; width: 20px; height: 1px; background: rgba(255,255,255,0.6); }
  .hero {
    position: absolute; top: 120px; left: 32px; right: 32px;
  }
  .hero h2 {
    font-size: clamp(28px, 8vw, 44px); font-weight: 800;
    letter-spacing: -0.025em; line-height: 1.15;
    margin: 0; color: white;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }
  .scene-meta {
    position: absolute; bottom: 140px; left: 32px; right: 32px;
  }
  .scene-meta .row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .scene-meta .row:last-child { margin-bottom: 0; }
  .scene-meta .ic { font-size: 18px; }
  .scene-meta .tx { font-size: 15px; color: rgba(255,255,255,0.95); font-weight: 500; }
  .scene-meta .tx b { font-weight: 800; }

  .scene-fab {
    position: absolute; bottom: 86px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    display: grid; place-items: center; font-size: 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    border: 0; cursor: pointer;
    animation: fab-pulse 2.5s ease-in-out infinite;
  }
  @keyframes fab-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  .scene-nav {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 12px; border-radius: 999px;
  }
  .scene-btn {
    border: 0; background: transparent;
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 16px; cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.2s;
  }
  .scene-btn:hover { background: rgba(255,255,255,0.1); }
  .scene-btn.active { background: rgba(255,255,255,0.95); }

  /* ============================================== */
  /* ===========   MODE B: 음성 대화   =========== */
  /* ============================================== */

  .voice-stage {
    background: radial-gradient(ellipse at center, #0A1929 0%, #050810 70%, #000 100%);
    padding: 80px 32px 40px;
  }
  .voice-page-title { text-align: center; margin-bottom: 28px; }
  .voice-page-title h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.05em; color: rgba(255,255,255,0.65); margin: 0; }
  .voice-page-title .sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }

  .split {
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
    max-width: 1400px; margin: 0 auto; align-items: start; justify-items: center;
    height: calc(100% - 80px);
  }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; gap: 24px; height: auto; } }

  .screen-block { display: flex; flex-direction: column; align-items: center; }
  .screen-tag {
    margin-bottom: 12px; text-align: center;
  }
  .screen-tag .num {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    background: var(--teal); color: #050810;
    font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
  }
  .screen-block:nth-child(2) .screen-tag .num { background: var(--lion); }
  .screen-tag p { font-size: 12px; color: rgba(255,255,255,0.5); margin: 4px 0 0; font-family: ui-monospace, Menlo, monospace; }

  /* Phone frame */
  .phone {
    width: 340px; max-width: 90vw;
    aspect-ratio: 9 / 19.5;
    border-radius: 44px; padding: 11px; background: #1A1A1A;
    box-shadow: 0 28px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
  }
  .phone::before {
    content: ''; position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 28px; background: #000; border-radius: 14px; z-index: 20;
  }
  .screen {
    width: 100%; height: 100%; border-radius: 33px;
    background: radial-gradient(ellipse at center, #0A1929 0%, #050810 70%, #000 100%);
    position: relative; overflow: hidden;
  }
  .screen.has-grid::before {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    pointer-events: none;
  }
  .nodes { position: absolute; inset: 0; pointer-events: none; }
  .node {
    position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%;
    background: var(--teal); box-shadow: 0 0 5px var(--teal);
    animation: float 4s ease-in-out infinite, twinkle-t 3s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(var(--fx, 8px), var(--fy, -8px)); } }
  @keyframes twinkle-t { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .top-label {
    position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--teal);
    display: flex; align-items: center; gap: 8px;
    z-index: 8; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    transition: color 0.4s;
  }
  .top-label::before, .top-label::after { content: ''; width: 16px; height: 1px; background: currentColor; }

  .jarvis { position: absolute; pointer-events: none; }
  .jarvis.center { top: 50%; left: 50%; width: 200px; height: 200px; margin-top: -100px; margin-left: -100px; }
  .jarvis.bottom-center { bottom: 52px; left: 50%; width: 84px; height: 84px; margin-left: -42px; z-index: 10; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--teal); opacity: 0.55; }
  .ring.r1 { border-color: var(--teal) transparent var(--teal) transparent; animation: rotate 8s linear infinite; }
  .ring.r2 { inset: 16px; border-color: transparent var(--cyan) transparent var(--cyan); animation: rotate 12s linear infinite reverse; }
  .ring.r3 { inset: 34px; border-color: var(--lion-glow) var(--lion-glow) transparent transparent; opacity: 0.6; animation: rotate 6s linear infinite; }
  .bottom-center .ring.r2 { inset: 10px; }
  .bottom-center .ring.r3 { inset: 20px; }
  .ticks { position: absolute; inset: 0; }
  .tick {
    position: absolute; left: 50%; top: 0;
    width: 1px; height: 6px; background: var(--teal);
    transform-origin: 50% 100px; opacity: 0.35;
  }
  .bottom-center .tick { transform-origin: 50% 42px; height: 4px; }

  .orbit {
    position: absolute; top: 50%; left: 50%;
    width: 170px; height: 170px; margin-top: -85px; margin-left: -85px;
    animation: rotate 16s linear infinite;
  }
  .bottom-center .orbit { width: 74px; height: 74px; margin-top: -37px; margin-left: -37px; }
  .orbit .o-dot {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan);
  }
  .bottom-center .orbit .o-dot { width: 3px; height: 3px; box-shadow: 0 0 5px var(--cyan); }
  .pulse-ring {
    position: absolute; top: 50%; left: 50%;
    width: 72px; height: 72px; margin-top: -36px; margin-left: -36px;
    border-radius: 50%; border: 1px solid var(--teal);
    animation: pulse-out 2.5s ease-out infinite; opacity: 0;
  }
  .pulse-ring:nth-child(5) { animation-delay: 0.6s; }
  .pulse-ring:nth-child(6) { animation-delay: 1.2s; }
  @keyframes pulse-out { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(3); opacity: 0; } }
  .bottom-center .pulse-ring { width: 46px; height: 46px; margin-top: -23px; margin-left: -23px; }

  .core-glow {
    position: absolute; top: 50%; left: 50%;
    width: 68px; height: 68px; margin-top: -34px; margin-left: -34px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--cyan) 0%, var(--teal) 40%, #0A4F4A 100%);
    box-shadow: 0 0 28px rgba(79,209,197,0.7), 0 0 56px rgba(79,209,197,0.4);
    animation: core-breathe 1.5s ease-in-out infinite;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .bottom-center .core-glow { width: 30px; height: 30px; margin-top: -15px; margin-left: -15px; box-shadow: 0 0 16px rgba(79,209,197,0.7); }
  @keyframes core-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .screen.thinking .core-glow {
    background: conic-gradient(from 0deg, var(--lion), var(--cyan), var(--teal), var(--lion-glow), var(--lion));
    animation: core-spin 1.2s linear infinite;
  }
  @keyframes core-spin { to { transform: rotate(360deg); } }
  .screen.thinking .top-label { color: var(--lion-glow); }
  .screen.responding .core-glow {
    background: radial-gradient(circle at 30% 30%, var(--lion-glow) 0%, var(--lion) 100%);
    box-shadow: 0 0 24px var(--lion-glow), 0 0 48px var(--lion);
  }
  .screen.responding .top-label { color: var(--lion-glow); }

  .user-typing {
    position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%);
    text-align: center; max-width: 86%;
    font-size: 13px; color: rgba(255,255,255,0.65);
    font-family: ui-monospace, Menlo, monospace; z-index: 5; min-height: 20px;
  }
  .user-typing::before { content: '"'; opacity: 0.5; }
  .user-typing::after  { content: '"'; opacity: 0.5; }
  .user-typing.empty::before, .user-typing.empty::after { content: ''; }
  .cursor {
    display: inline-block; width: 5px; height: 12px;
    background: var(--teal); vertical-align: middle; margin-left: 4px;
    animation: cursor 1s steps(1) infinite;
  }
  @keyframes cursor { 50% { opacity: 0; } }

  /* Screen 2 immersive */
  .bg-image {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 0.8s ease; z-index: 1;
  }
  .bg-image.visible { opacity: 1; }
  .bg-image.fallback {
    background: radial-gradient(ellipse at center, rgba(232,122,62,0.25) 0%, transparent 70%),
                linear-gradient(135deg, #78350F 0%, #451A03 50%, #1C1917 100%);
    display: grid; place-items: center;
  }
  .bg-image.fallback .emo { font-size: 160px; filter: drop-shadow(0 0 24px rgba(244,184,96,0.5)); }
  .overlay {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.35) 20%, rgba(0,0,0,0.25) 45%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.9) 100%);
  }
  .imm-user {
    position: absolute; top: 98px; left: 50%; transform: translateX(-50%);
    text-align: center; max-width: 86%;
    font-size: 12px; color: rgba(255,255,255,0.7);
    font-family: ui-monospace, Menlo, monospace; z-index: 6; min-height: 18px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
    opacity: 0; transition: opacity 0.5s;
  }
  .imm-user.visible { opacity: 1; }
  .imm-user::before { content: '"'; opacity: 0.55; }
  .imm-user::after  { content: '"'; opacity: 0.55; }
  .imm-user.empty::before, .imm-user.empty::after { content: ''; }
  .imm-ai {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; width: 86%; z-index: 6;
    opacity: 0; transition: opacity 0.6s;
  }
  .imm-ai.visible { opacity: 1; }
  .imm-ai h2 {
    font-size: clamp(24px, 6vw, 32px); font-weight: 800;
    letter-spacing: -0.025em; line-height: 1.15;
    margin: 0; color: white; text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }
  .imm-typing {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: none; align-items: center; gap: 8px;
    z-index: 6; opacity: 0; transition: opacity 0.3s;
  }
  .imm-typing.visible { display: flex; opacity: 1; }
  .imm-typing .d {
    width: 9px; height: 9px; border-radius: 50%; background: var(--lion-glow);
    box-shadow: 0 0 10px var(--lion-glow);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .imm-typing .d:nth-child(2) { animation-delay: 0.15s; }
  .imm-typing .d:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
    30%           { transform: translateY(-8px) scale(1.15); opacity: 1; }
  }

  .data-tag {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: rgba(79,209,197,0.45);
    font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.05em; z-index: 5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<!-- 모드 토글 -->
<div class="mode-switch">
  <button class="mode-btn active" data-mode="scenes">🌧 시점 시나리오</button>
  <button class="mode-btn" data-mode="voice">🎙 음성 대화</button>
</div>
<div class="help" id="helpText">← → 시점 / 1-5 점프</div>

<!-- ───── MODE A: 시점 ───── -->
<div class="stage scene-stage rainy" id="sceneStage">
  <div class="scene-bg"></div>
  <div class="rain-layer" id="rainLayer"></div>
  <div class="sun" id="sun" style="display:none;"></div>
  <div class="ray" id="ray" style="display:none;"></div>
  <div class="plate" id="plate" style="display:none;"></div>
  <div class="steam" id="steam" style="display:none;"></div>
  <div class="city" id="city" style="display:none;"></div>
  <div class="windows" id="windows" style="display:none;"></div>
  <div class="moon" id="moon" style="display:none;"></div>

  <div class="scene-ui">
    <div class="status-bar"><span>9:41</span><span>📶 100%</span></div>
    <div class="moment-label" id="sceneMomentLabel">🌅 Morning</div>
    <div class="hero"><h2 id="sceneHero">자켓 · 우산<br>꼭 챙기세요.</h2></div>
    <div class="scene-meta" id="sceneMeta">
      <div class="row"><span class="ic">🌧</span><span class="tx">기온 <b>14°</b> · 비 80%</span></div>
      <div class="row"><span class="ic">💼</span><span class="tx"><b>클라이언트 미팅</b> 10:00</span></div>
    </div>
    <button class="scene-fab" aria-label="라이언">🎤</button>
    <div class="scene-nav">
      <button class="scene-btn active" data-scene="rainy" title="비">🌧</button>
      <button class="scene-btn" data-scene="sunny" title="맑음">☀️</button>
      <button class="scene-btn" data-scene="lunch" title="점심">🍱</button>
      <button class="scene-btn" data-scene="evening" title="저녁">🌆</button>
      <button class="scene-btn" data-scene="night" title="취침">🌙</button>
    </div>
  </div>
</div>

<!-- ───── MODE B: 음성 ───── -->
<div class="stage voice-stage" id="voiceStage" hidden>
  <div class="voice-page-title">
    <h1>라이언 음성 인터랙션</h1>
    <div class="sub">Screen 1 — 음성 인식 / Screen 2 — 풀스크린 응답</div>
  </div>

  <div class="split">
    <div class="screen-block">
      <div class="screen-tag">
        <div class="num">SCREEN 1</div>
        <p>jarvis · center · listening</p>
      </div>
      <div class="phone">
        <div class="screen has-grid" id="screen1">
          <div class="nodes" id="nodes1"></div>
          <div class="top-label" id="label1">🎙 LION · LISTENING</div>
          <div class="jarvis center">
            <div class="ticks" id="ticks1"></div>
            <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
            <div class="orbit" id="orbit1"></div>
            <div class="pulse-ring"></div><div class="pulse-ring"></div><div class="pulse-ring"></div>
            <div class="core-glow"></div>
          </div>
          <div class="user-typing empty" id="userTyping"><span class="cursor"></span></div>
          <div class="data-tag">STT · ko-KR · 24ms</div>
        </div>
      </div>
    </div>

    <div class="screen-block">
      <div class="screen-tag">
        <div class="num">SCREEN 2</div>
        <p>full-bleed · jarvis bottom-center</p>
      </div>
      <div class="phone">
        <div class="screen" id="screen2">
          <div class="bg-image" id="bgImage"></div>
          <div class="overlay"></div>
          <div class="top-label" id="label2">🎙 LION · LISTENING</div>
          <div class="imm-user empty" id="immUser"><span class="cursor"></span></div>
          <div class="imm-typing" id="immTyping"><span class="d"></span><span class="d"></span><span class="d"></span></div>
          <div class="imm-ai" id="immAi"><h2 id="immAiText"></h2></div>
          <div class="jarvis bottom-center">
            <div class="ticks" id="ticks2"></div>
            <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
            <div class="orbit" id="orbit2"></div>
            <div class="pulse-ring"></div><div class="pulse-ring"></div><div class="pulse-ring"></div>
            <div class="core-glow"></div>
          </div>
          <div class="data-tag" id="data2Tag">STT · ko-KR · 24ms</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  /* ───────── 모드 전환 ───────── */
  const modeBtns = document.querySelectorAll('.mode-btn');
  const sceneStage = document.getElementById('sceneStage');
  const voiceStage = document.getElementById('voiceStage');
  const helpText = document.getElementById('helpText');
  let currentMode = 'scenes';

  function setMode(mode) {
    currentMode = mode;
    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    sceneStage.hidden = mode !== 'scenes';
    voiceStage.hidden = mode !== 'voice';
    helpText.textContent = mode === 'scenes' ? '← → 시점 / 1-5 점프' : '자동 대화 사이클';
  }

  modeBtns.forEach(b => b.addEventListener('click', () => {
    setMode(b.dataset.mode);
    location.hash = b.dataset.mode;
  }));

  // initial: hash
  const hash = location.hash.replace('#','');
  if (hash === 'voice' || hash === 'scenes') setMode(hash);

  /* =================================================== */
  /* ===========   MODE A: 시점 빌더    =============== */
  /* =================================================== */

  const rainLayer = document.getElementById('rainLayer');
  function buildRain() {
    rainLayer.innerHTML = '';
    for (let i = 0; i < 130; i++) {
      const d = document.createElement('div');
      d.className = 'drop';
      d.style.left = Math.random() * 110 + '%';
      d.style.height = (30 + Math.random()*50) + 'px';
      d.style.animationDuration = (0.5 + Math.random()*0.6) + 's';
      d.style.animationDelay = -Math.random()*1.5 + 's';
      d.style.opacity = 0.3 + Math.random()*0.5;
      d.style.transform = 'rotate(15deg)';
      rainLayer.appendChild(d);
    }
    for (let i = 0; i < 28; i++) {
      const s = document.createElement('div');
      s.className = 'splash';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (0.6 + Math.random()*0.4) + 's';
      s.style.animationDelay = -Math.random() + 's';
      rainLayer.appendChild(s);
    }
  }
  buildRain();

  function buildClouds() {
    if (sceneStage.querySelector('.cloud-i')) return;
    for (let i = 0; i < 3; i++) {
      const c = document.createElement('div');
      c.className = 'cloud cloud-i';
      c.style.top = (10 + i*18) + '%';
      c.style.animationDuration = (40 + i*15) + 's';
      c.style.animationDelay = -(i*12) + 's';
      c.style.opacity = 0.5 + Math.random()*0.3;
      sceneStage.appendChild(c);
    }
  }
  function buildWindows() {
    const wl = document.getElementById('windows');
    wl.innerHTML = '';
    for (let i = 0; i < 60; i++) {
      const w = document.createElement('div');
      w.className = 'window';
      w.style.left = Math.random()*100 + '%';
      w.style.bottom = (Math.random()*30) + '%';
      w.style.animationDuration = (3 + Math.random()*4) + 's';
      w.style.animationDelay = -Math.random()*5 + 's';
      wl.appendChild(w);
    }
  }
  function buildStars() {
    sceneStage.querySelectorAll('.star').forEach(s => s.remove());
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const sz = 1 + Math.random()*2.5;
      s.style.width = sz + 'px'; s.style.height = sz + 'px';
      s.style.left = Math.random()*100 + '%';
      s.style.top = (5 + Math.random()*55) + '%';
      s.style.animationDuration = (1.5 + Math.random()*2.5) + 's';
      s.style.animationDelay = -Math.random()*3 + 's';
      s.style.opacity = 0.3 + Math.random()*0.7;
      sceneStage.appendChild(s);
    }
  }

  const scenes = {
    rainy: {
      bg: 'rainy', label: '🌅 Morning', hero: '자켓 · 우산<br>꼭 챙기세요.',
      meta: [{ic:'🌧',tx:'기온 <b>14°</b> · 비 80%'},{ic:'💼',tx:'<b>클라이언트 미팅</b> 10:00'}],
      show: ['rainLayer']
    },
    sunny: {
      bg: 'sunny', label: '🌅 Morning', hero: '가벼운 옷차림<br>딱 좋은 날이에요.',
      meta: [{ic:'☀️',tx:'기온 <b>22°</b> · 맑음'},{ic:'📅',tx:'오늘 외부 일정 없음'}],
      show: ['sun','ray','cloud-i']
    },
    lunch: {
      bg: 'lunch', label: '🍱 Lunch', hero: '오늘 점심엔<br>닭가슴살 샐러드.',
      meta: [{ic:'🥚',tx:'콜레스테롤 관리 · <b>단백질 38g</b>'},{ic:'📍',tx:'<b>B카페 강남점</b> · 도보 6분'}],
      show: ['plate','steam']
    },
    evening: {
      bg: 'evening', label: '🌆 Evening', hero: '오늘 하루<br>어떠셨어요?',
      meta: [{ic:'🚶',tx:'<b>5,200</b>걸음 · 목표 74%'},{ic:'💆',tx:'스트레스 받으셨네요. 매콤 한 그릇 어때요?'}],
      show: ['city','windows']
    },
    night: {
      bg: 'night', label: '🌙 Night', hero: '오늘 하루<br>수고하셨어요.',
      meta: [{ic:'😴',tx:'취침 권장 <b>23:00</b>'},{ic:'📵',tx:'집중 모드 자동 활성화'}],
      show: ['moon','star']
    }
  };

  function setScene(name) {
    sceneStage.className = 'stage scene-stage ' + name;
    const s = scenes[name];
    document.getElementById('sceneMomentLabel').innerHTML = s.label;
    document.getElementById('sceneHero').innerHTML = s.hero;
    document.getElementById('sceneMeta').innerHTML = s.meta.map(m =>
      `<div class="row"><span class="ic">${m.ic}</span><span class="tx">${m.tx}</span></div>`).join('');
    ['rainLayer','sun','ray','plate','steam','city','windows','moon'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = 'none';
    });
    sceneStage.querySelectorAll('.cloud-i').forEach(c => c.style.display = 'none');
    sceneStage.querySelectorAll('.star').forEach(c => c.style.display = 'none');
    s.show.forEach(cls => {
      if (cls === 'cloud-i') {
        if (!sceneStage.querySelector('.cloud-i')) buildClouds();
        sceneStage.querySelectorAll('.cloud-i').forEach(c => c.style.display = '');
      } else if (cls === 'star') {
        if (!sceneStage.querySelector('.star')) buildStars();
        sceneStage.querySelectorAll('.star').forEach(c => c.style.display = '');
      } else {
        const el = document.getElementById(cls); if (el) el.style.display = '';
      }
    });
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.toggle('active', b.dataset.scene === name));
  }
  document.querySelectorAll('.scene-btn').forEach(b => b.addEventListener('click', () => setScene(b.dataset.scene)));

  /* =================================================== */
  /* ===========   MODE B: 음성 빌더    =============== */
  /* =================================================== */

  const nodesEl1 = document.getElementById('nodes1');
  for (let i = 0; i < 22; i++) {
    const n = document.createElement('div');
    n.className = 'node';
    n.style.left = Math.random()*100 + '%';
    n.style.top = Math.random()*100 + '%';
    n.style.setProperty('--fx', (Math.random()*16-8) + 'px');
    n.style.setProperty('--fy', (Math.random()*16-8) + 'px');
    n.style.animationDuration = (3 + Math.random()*4) + 's';
    n.style.animationDelay = -Math.random()*4 + 's';
    nodesEl1.appendChild(n);
  }

  ['ticks1','ticks2'].forEach(id => {
    const el = document.getElementById(id);
    for (let i = 0; i < 60; i++) {
      const t = document.createElement('div');
      t.className = 'tick';
      t.style.transform = `rotate(${i*6}deg)`;
      if (i%5===0) { t.style.height = '10px'; t.style.opacity = '0.6'; }
      el.appendChild(t);
    }
  });

  function buildOrbit(id, radius) {
    const el = document.getElementById(id);
    for (let i = 0; i < 6; i++) {
      const d = document.createElement('div');
      d.className = 'o-dot';
      const a = (i/6) * Math.PI * 2;
      d.style.left = `calc(50% + ${Math.cos(a)*radius}px - 2.5px)`;
      d.style.top  = `calc(50% + ${Math.sin(a)*radius}px - 2.5px)`;
      d.style.opacity = (i%2===0) ? '1' : '0.5';
      el.appendChild(d);
    }
  }
  buildOrbit('orbit1', 82);
  buildOrbit('orbit2', 30);

  const dialogues = [
    { user: '오늘 점심 뭐 먹지?',          ai: '오늘은<br>보쌈 어때요?',       img: 'https://source.unsplash.com/600x900/?bossam,korean,pork',  emo: '🥩' },
    { user: '비 오는데 따뜻한 거.',         ai: '따끈한<br>우동 어떠세요?',     img: 'https://source.unsplash.com/600x900/?udon,noodle',         emo: '🍜' },
    { user: '스트레스 받았어. 매콤한 거.',  ai: '얼큰한<br>김치찌개 어때요?',   img: 'https://source.unsplash.com/600x900/?kimchi,stew,korean',  emo: '🍲' },
    { user: '건강한 거 추천해줘.',          ai: '닭가슴살<br>샐러드 어떠세요?', img: 'https://source.unsplash.com/600x900/?chicken,salad,healthy', emo: '🥗' },
    { user: '고기 먹고 싶어.',              ai: '삼겹살<br>한 판 어떠세요?',    img: 'https://source.unsplash.com/600x900/?samgyeopsal,bbq',     emo: '🥩' },
  ];

  let idx = 0;
  let voiceTimers = [];
  function schedule(fn, ms) { const t = setTimeout(fn, ms); voiceTimers.push(t); return t; }
  function clearVoiceTimers() { voiceTimers.forEach(t => clearTimeout(t)); voiceTimers = []; }

  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');
  const label1 = document.getElementById('label1');
  const label2 = document.getElementById('label2');
  const userTyping = document.getElementById('userTyping');
  const immUser = document.getElementById('immUser');
  const immTyping = document.getElementById('immTyping');
  const immAi = document.getElementById('immAi');
  const immAiText = document.getElementById('immAiText');
  const bgImage = document.getElementById('bgImage');
  const data2Tag = document.getElementById('data2Tag');

  function setVoiceState(state) {
    screen1.classList.remove('thinking','responding');
    screen2.classList.remove('thinking','responding');
    if (state === 'thinking') {
      screen1.classList.add('thinking'); screen2.classList.add('thinking');
      label1.textContent = '⚙ LION · ANALYZING'; label2.textContent = '⚙ LION · ANALYZING';
      data2Tag.textContent = 'claude-4.6 · analyzing...';
    } else if (state === 'responding') {
      screen1.classList.add('responding'); screen2.classList.add('responding');
      label1.textContent = '✨ LION · RESPONSE'; label2.textContent = '✨ LION · RESPONSE';
      data2Tag.textContent = 'claude-4.6 · 0.8s';
    } else {
      label1.textContent = '🎙 LION · LISTENING'; label2.textContent = '🎙 LION · LISTENING';
      data2Tag.textContent = 'STT · ko-KR · 24ms';
    }
  }

  function preloadImg(url) {
    return new Promise(r => { const i = new Image(); i.onload=()=>r(true); i.onerror=()=>r(false); i.src=url; });
  }

  function voiceTurn() {
    const d = dialogues[idx];
    idx = (idx + 1) % dialogues.length;
    const userMs = d.user.length * 60;

    setVoiceState('listening');
    userTyping.classList.add('empty'); userTyping.innerHTML = '<span class="cursor"></span>';
    immUser.classList.add('empty'); immUser.classList.remove('visible');
    immUser.innerHTML = '<span class="cursor"></span>';
    immTyping.classList.remove('visible');
    immAi.classList.remove('visible');
    immAiText.innerHTML = '';
    bgImage.classList.remove('visible','fallback');
    bgImage.style.backgroundImage = ''; bgImage.innerHTML = '';

    preloadImg(d.img).then(ok => {
      if (ok) { bgImage.style.backgroundImage = `url("${d.img}")`; bgImage.classList.remove('fallback'); }
      else { bgImage.classList.add('fallback'); bgImage.innerHTML = `<div class="emo">${d.emo}</div>`; }
    });

    schedule(() => {
      userTyping.classList.remove('empty');
      immUser.classList.remove('empty');
      immUser.classList.add('visible');
      let i = 0;
      function step() {
        if (i < d.user.length) {
          const p = d.user.slice(0, i+1);
          userTyping.innerHTML = p + '<span class="cursor"></span>';
          immUser.innerHTML    = p + '<span class="cursor"></span>';
          i++;
          schedule(step, 60);
        } else {
          userTyping.innerHTML = d.user;
          immUser.innerHTML = d.user;
        }
      }
      step();
    }, 400);

    const tThinking = 400 + userMs + 600;
    schedule(() => {
      setVoiceState('thinking');
      immTyping.classList.add('visible');
    }, tThinking);

    const tResp = tThinking + 1500;
    schedule(() => {
      immTyping.classList.remove('visible');
      setVoiceState('responding');
      bgImage.classList.add('visible');
      immAi.classList.add('visible');
      immAiText.innerHTML = d.ai;
    }, tResp);

    const fadeAt = tResp + 3500;
    schedule(() => {
      immUser.classList.remove('visible');
      immAi.classList.remove('visible');
      bgImage.classList.remove('visible');
      userTyping.classList.add('empty');
      userTyping.innerHTML = '<span class="cursor"></span>';
    }, fadeAt);

    schedule(voiceTurn, fadeAt + 800);
  }

  /* 키보드 ── 시점 시 좌/우/1-5 ── */
  document.addEventListener('keydown', e => {
    if (currentMode === 'scenes') {
      const order = ['rainy','sunny','lunch','evening','night'];
      const cur = document.querySelector('.scene-btn.active').dataset.scene;
      const i = order.indexOf(cur);
      if (e.key === 'ArrowRight' || e.key === ' ') setScene(order[Math.min(i+1, order.length-1)]);
      if (e.key === 'ArrowLeft') setScene(order[Math.max(i-1, 0)]);
      const n = parseInt(e.key);
      if (n >= 1 && n <= 5) setScene(order[n-1]);
    }
  });

  /* 시작 */
  schedule(voiceTurn, 800);
</script>

</body>
</html>
