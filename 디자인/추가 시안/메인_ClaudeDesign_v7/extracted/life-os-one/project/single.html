<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>v7 single</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9;
    font-family: "Pretendard Variable", "Pretendard", -apple-system, system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="variations.jsx"></script>
<script type="text/babel">
  const params = new URLSearchParams(location.search);
  const v = parseInt(params.get('v') || '1', 10);
  const time = params.get('time') || 'lunch';
  const Variants = [V1_SoftStack, V2_Conversation, V3_Orbit, V4_Editorial, V5_Fan];
  const C = Variants[v - 1] || V1_SoftStack;
  function Root() {
    return (
      <IOSDevice width={380} height={800}>
        <LionScreen time={time}>
          <C time={time} />
        </LionScreen>
      </IOSDevice>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
