<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "mineral-bg": "#0E141B",
            "surface-card": "#1A222D",
            "accent-slate": "#88A0B5",
            "primary-deep": "#F2F4F7",
            "secondary-text": "#A8B2BE",
            "tertiary-text": "#6B7A8B",
            "separator-hairline": "#2A3340"
          },
          borderRadius: {
            "DEFAULT": "12px",
            "lg": "16px",
            "xl": "24px",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Inter", "Apple SD Gothic Neo", "sans-serif"],
            "display": ["Inter", "Apple SD Gothic Neo", "sans-serif"],
            "body": ["Inter", "Apple SD Gothic Neo", "sans-serif"],
            "label": ["Inter", "Apple SD Gothic Neo", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
  body { 
    -webkit-font-smoothing: antialiased; 
    -moz-osx-font-smoothing: grayscale; 
    background-color: #0E141B; 
  } 
  .ios-blur { 
    backdrop-filter: blur(40px) saturate(180%); 
    -webkit-backdrop-filter: blur(40px) saturate(180%); 
  } 
  .apple-continuous-corners { 
    border-radius: 12px; 
  } 
  .material-symbols-outlined { 
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; 
  }
</style>
</head>
<body class="font-body text-primary-deep selection:bg-accent-slate/20">
<div class="fixed top-0 w-full h-[54px] z-[60] flex items-center justify-between px-6 pointer-events-none" id="ios-status-bar">
<div class="text-[13px] font-semibold text-[#F2F4F7] leading-none">9:41</div>
<div class="w-[120px] h-[37px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-[11px]"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[12px] text-[#F2F4F7]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[12px] text-[#F2F4F7]">wifi</span>
<span class="material-symbols-outlined text-[12px] text-[#F2F4F7] rotate-90">battery_full</span>
</div>
</div>
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full h-[44px] z-50 bg-[#0E141B]/72 backdrop-blur-[40px] border-b-[0.5px] border-[#2A3340] flex items-center justify-between px-[20px] pt-[54px] mt-[8px]">
<div class="flex items-center justify-center w-8 h-8 text-[#F2F4F7] active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-[37px]" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
<div class="flex-1"></div>
<button class="flex items-center justify-center opacity-80 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-[#F2F4F7]" data-icon="settings">settings</span>
</button>
</header>
<main class="pt-[calc(54px+44px+24px)] pb-[calc(112px+env(safe-area-inset-bottom))] px-[20px]">
<!-- Greeting Section -->
<section class="mb-6">
<p class="text-[13px] font-medium text-[#A8B2BE] tracking-tight mb-[4px]">수요일</p>
<h1 class="text-[34px] font-bold tracking-tight mb-0 text-[#F2F4F7]">다환님,</h1>
<h2 class="text-[22px] font-semibold text-[#F2F4F7] tracking-tight mt-[8px]">좋은 아침이에요</h2>
</section>
<!-- Hero / Mascot Area -->
<section class="flex flex-col items-center justify-center mb-8">
<div class="relative w-[180px] h-[180px] flex items-center justify-center mb-[8px]">
<div class="absolute inset-0 rounded-full" style="background: radial-gradient(circle, rgba(136, 160, 181, 0.18) 0%, transparent 70%);"></div>
<div class="h-20 rounded-full relative z-10" style="background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 25%, rgba(136,160,181,0.4) 55%, transparent 100%); width: 60pt; height: 60pt;">
<div class="absolute inset-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-white/95"></div>
</div>
</div>
<p class="text-[17px] text-center leading-[1.5] text-[#F2F4F7] max-w-[280px]">
    비 80%에 강남 미팅 있는 날이에요. <br/>
<span class="font-semibold">우산이랑 트렌치, 제가 챙길게요.</span>
</p>
</section>
<!-- Suggested Action Chips -->
<section class="bg-[#1A222D] rounded-[12px] overflow-hidden shadow-[0_2px_8px_rgba(0,0,0,0.1)] mb-[24px]">
<button class="w-full h-[52px] px-[20px] flex items-center justify-between border-b-[0.5px] border-[#2A3340] active:bg-[#232C3A]">
<span class="text-[15px] font-medium text-[#F2F4F7]">오늘 점심 뭐 먹는 게 좋을까?</span>
<span class="material-symbols-outlined" style="color: #6B7A8B; font-size: 14pt;">chevron_right</span>
</button>
<button class="w-full h-[52px] px-[20px] flex items-center justify-between border-b-[0.5px] border-[#2A3340] active:bg-[#232C3A]">
<span class="text-[15px] font-medium text-[#F2F4F7]">10시 미팅 자료 정리해줘</span>
<span class="material-symbols-outlined" style="color: #6B7A8B; font-size: 14pt;">chevron_right</span>
</button>
<button class="w-full h-[52px] px-[20px] flex items-center justify-between active:bg-[#232C3A]">
<span class="text-[15px] font-medium text-[#F2F4F7]">이번 주 일정 한눈에 보여줘</span>
<span class="material-symbols-outlined" style="color: #6B7A8B; font-size: 14pt;">chevron_right</span>
</button>
</section>
</main>
<!-- Composer Area (Floating above tab bar) -->
<div class="fixed bottom-[calc(49px+env(safe-area-inset-bottom)+12px)] left-0 w-full px-[20px] z-50 mt-4">
<div class="flex items-center w-full h-[50px] bg-[#232C3A] rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.2)] px-4 border-[1px] border-[rgba(136,160,181,0.4)]">
<input class="flex-1 bg-transparent border-none focus:ring-0 text-[16px] placeholder:text-[#6B7A8B] p-0 ml-1 text-[#F2F4F7]" placeholder="라이언에게 물어보세요..." type="text"/>
<button class="w-8 h-8 flex items-center justify-center text-[#A8B2BE] active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full h-[calc(49px+env(safe-area-inset-bottom))] z-50 bg-[rgba(20,28,40,0.72)] ios-blur border-t-[0.5px] border-[#2A3340] flex justify-around items-center px-[20px] pb-[env(safe-area-inset-bottom)]">
<div class="flex flex-col items-center justify-center text-[#6B7A8B] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]" data-icon="home">home</span>
<span class="text-[11px] font-medium leading-[1.5]">홈</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7A8B] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]" data-icon="light_mode">light_mode</span>
<span class="text-[11px] font-medium leading-[1.5]">장면</span>
</div>
<div class="flex flex-col items-center justify-center text-[#88A0B5] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="text-[11px] font-medium leading-[1.5]">라이언</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7A8B] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]" data-icon="fitness_center">fitness_center</span>
<span class="text-[11px] font-medium leading-[1.5]">코치</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7A8B] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-[24px]" data-icon="person">person</span>
<span class="text-[11px] font-medium leading-[1.5]">나</span>
</div>
</nav>
</body></html>
