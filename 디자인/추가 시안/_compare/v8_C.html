// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

const TIME_LABEL = { morning: '아침', noon: '점심', evening: '저녁' };
const TIME_SYMBOL = { morning: '◴', noon: '◐', evening: '◖' };

// ─────────────────────────────────────────────────────────────
// Lion mascots — five different abstractions.
// Each accepts { size, accent } and is otherwise flat.
// ─────────────────────────────────────────────────────────────

// 1. Geometric face — circles + minimal features.
function LionFace({ size = 64, accent = T.morning, mood = 'soft' }) {
  const mane = 12;
  const ring = [];
  for (let i = 0; i < mane; i++) {
    const a = (i / mane) * Math.PI * 2;
    ring.push(
      <circle
        key={i}
        cx={50 + 32 * Math.cos(a)}
        cy={50 + 32 * Math.sin(a)}
        r={11}
        fill={accent}
        opacity={mood === 'soft' ? 0.92 : 1}
      />
    );
  }
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" style={{ display: 'block' }}>
      {ring}
      <circle cx="50" cy="52" r="24" fill="#F6E7D3" />
      <circle cx="42" cy="50" r="1.8" fill={T.ink} />
      <circle cx="58" cy="50" r="1.8" fill={T.ink} />
      <path d="M48 58 Q50 60 52 58" stroke={T.ink} strokeWidth="1.4" fill="none" strokeLinecap="round" />
      <path d="M50 60 Q47 64 44 62" stroke={T.ink} strokeWidth="1.2" fill="none" strokeLinecap="round" />
      <path d="M50 60 Q53 64 56 62" stroke={T.ink} strokeWidth="1.2" fill="none" strokeLinecap="round" />
    </svg>
  );
}

// 2. Monogram — serif L inside a ring with mane dashes.
function LionMonogram({ size = 64, accent = T.morning }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" style={{ display: 'block' }}>
      {Array.from({ length: 24 }).map((_, i) => {
        const a = (i / 24) * Math.PI * 2;
        return (
          <line
            key={i}
            x1={50 + 36 * Math.cos(a)}
            y1={50 + 36 * Math.sin(a)}
            x2={50 + 46 * Math.cos(a)}
            y2={50 + 46 * Math.sin(a)}
            stroke={accent}
            strokeWidth={2.2}
            strokeLinecap="round"
          />
        );
      })}
      <circle cx="50" cy="50" r="32" fill="#FAF7F1" stroke={accent} strokeWidth="1.2" />
      <text
        x="50"
        y="63"
        textAnchor="middle"
        fontFamily="'Noto Serif KR', serif"
        fontSize="40"
        fontWeight="500"
        fill={T.ink}
        fontStyle="italic"
      >L</text>
    </svg>
  );
}

// 3. Orb — gradient circle suggesting glow, no face.
function LionOrb({ size = 120, accent = T.morning }) {
  const id = React.useId();
  return (
    <svg width={size} height={size} viewBox="0 0 200 200" style={{ display: 'block' }}>
      <defs>
        <radialGradient id={`o1-${id}`} cx="40%" cy="35%" r="65%">
          <stop offset="0%" stopColor="#FFF3E0" />
          <stop offset="55%" stopColor={accent} stopOpacity="0.95" />
          <stop offset="100%" stopColor={accent} stopOpacity="0.55" />
        </radialGradient>
        <radialGradient id={`o2-${id}`} cx="50%" cy="50%" r="50%">
          <stop offset="60%" stopColor="rgba(0,0,0,0)" />
          <stop offset="100%" stopColor="rgba(0,0,0,0.12)" />
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="88" fill={`url(#o1-${id})`} />
      <circle cx="100" cy="100" r="88" fill={`url(#o2-${id})`} />
      <circle cx="74" cy="74" r="14" fill="rgba(255,255,255,0.55)" />
    </svg>
  );
}

// 4. Line-drawn lion silhouette (very simple, single-stroke).
function LionLine({ size = 64, accent = T.morning, stroke = T.ink }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" style={{ display: 'block' }}>
      <circle cx="50" cy="55" r="38" fill="none" stroke={accent} strokeWidth="1.2" strokeDasharray="2 4" />
      <path
        d="M28 52 Q24 36 36 32 Q34 22 46 24 Q50 18 54 24 Q66 22 64 32 Q76 36 72 52 Q72 70 50 78 Q28 70 28 52 Z"
        fill="none"
        stroke={stroke}
        strokeWidth="1.6"
        strokeLinejoin="round"
      />
      <circle cx="42" cy="52" r="1.4" fill={stroke} />
      <circle cx="58" cy="52" r="1.4" fill={stroke} />
      <path d="M48 60 L50 63 L52 60 Z" fill={stroke} />
      <path d="M46 66 Q50 69 54 66" stroke={stroke} strokeWidth="1.2" fill="none" strokeLinecap="round" />
    </svg>
  );
}

// 5. Wordmark "라이언" with subtle ornament — typographic only.
function LionWordmark({ size = 1, accent = T.morning, dark = false }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'baseline', gap: 6 * size,
      fontFamily: T.serif, color: dark ? '#fff' : T.ink,
      fontSize: 22 * size, fontWeight: 600, letterSpacing: '-0.01em',
    }}>
      <span style={{
        width: 6 * size, height: 6 * size, borderRadius: '50%',
        background: accent, alignSelf: 'center',
      }} />
      <span>라이언</span>
    </span>
  );
}

// ─────────────────────────────────────────────────────────────
// Shared UI atoms
// ─────────────────────────────────────────────────────────────

// "라이언아" voice call pill — used in every variation, styled per design.
function VoicePill({ accent, variant = 'pill', dark = false }) {
  const ink = dark ? '#fff' : T.ink;
  const sub = dark ? 'rgba(255,255,255,0.55)' : T.mute;
  if (variant === 'pill') {
    return (
      <div style={{
        display: 'flex', alignItems: 'center', gap: 12,
        background: dark ? 'rgba(255,255,255,0.06)' : '#fff',
        borderRadius: 999, padding: '10px 14px 10px 12px',
        boxShadow: dark ? 'none' : '0 1px 0 rgba(0,0,0,0.04), 0 6px 18px rgba(40,30,15,0.06)',
        border: dark ? '1px solid rgba(255,255,255,0.08)' : `1px solid ${T.line}`,
        fontFamily: T.sans,
      }}>
        <div style={{
          width: 28, height: 28, borderRadius: '50%',
          background: accent, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexShrink: 0,
        }}>
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none">
            <rect x="4" y="1" width="4" height="8" rx="2" fill="#fff"/>
            <path d="M1.5 6.5v.5a4.5 4.5 0 009 0v-.5M6 11.5v1.5" stroke="#fff" strokeWidth="1.2" strokeLinecap="round"/>
          </svg>
        </div>
        <div style={{ fontSize: 14.5, color: ink, fontWeight: 500, letterSpacing: '-0.01em' }}>"라이언아"</div>
        <div style={{ flex: 1 }} />
        <div style={{ fontSize: 12, color: sub, fontFamily: T.mono, letterSpacing: '0.02em' }}>HOLD</div>
      </div>
    );
  }
  if (variant === 'block') {
    return (
      <div style={{
        display: 'flex', alignItems: 'center', gap: 14,
        background: 'transparent',
        borderRadius: 0, padding: '14px 0',
        borderTop: `1px solid ${T.line}`, borderBottom: `1px solid ${T.line}`,
        fontFamily: T.sans,
      }}>
        <VoiceWave accent={accent} />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          <div style={{ fontSize: 15, color: ink, fontWeight: 500 }}>"라이언아" 라고 불러보세요</div>
          <div style={{ fontSize: 12, color: sub, fontFamily: T.mono }}>어디서든 호출 가능</div>
        </div>
      </div>
    );
  }
  return null;
}

function VoiceWave({ accent, count = 5 }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 3, height: 28 }}>
      {Array.from({ length: count }).map((_, i) => (
        <div key={i} style={{
          width: 3, height: [10, 18, 24, 18, 10][i] || 14,
          background: accent, borderRadius: 4, opacity: 0.85,
        }} />
      ))}
    </div>
  );
}

// Persona chip strip — used by variations that surface tags explicitly.
function PersonaStrip({ persona, accent, dark = false, variant = 'inline' }) {
  const ink = dark ? 'rgba(255,255,255,0.7)' : T.mute;
  if (variant === 'inline') {
    return (
      <div style={{
        fontFamily: T.mono, fontSize: 10.5, letterSpacing: '0.06em',
        color: ink, textTransform: 'uppercase',
      }}>
        {persona.tagShort}
      </div>
    );
  }
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
      {persona.tags.slice(0, 3).map(t => (
        <span key={t.value} style={{
          padding: '4px 9px', borderRadius: 999,
          background: 'rgba(26,26,28,0.04)',
          fontFamily: T.sans, fontSize: 11.5, color: T.ink2,
          border: `1px solid ${T.line}`,
        }}>
          <span style={{ color: accent, marginRight: 6 }}>·</span>{t.value}
        </span>
      ))}
    </div>
  );
}

// Time-of-day toggle (in-app). Three pills.
function TimeToggle({ value, onChange, accent, dark = false, compact = false }) {
  const ink = dark ? '#fff' : T.ink;
  const sub = dark ? 'rgba(255,255,255,0.45)' : T.mute;
  return (
    <div style={{
      display: 'inline-flex', alignItems: 'center', gap: compact ? 2 : 4,
      padding: 3, borderRadius: 999,
      background: dark ? 'rgba(255,255,255,0.06)' : 'rgba(26,26,28,0.04)',
      border: dark ? '1px solid rgba(255,255,255,0.08)' : `1px solid ${T.line}`,
      fontFamily: T.sans,
    }}>
      {TIMES.map(t => {
        const active = t === value;
        return (
          <button
            key={t}
            onClick={() => onChange(t)}
            style={{
              border: 0, cursor: 'pointer',
              padding: compact ? '4px 9px' : '6px 11px',
              borderRadius: 999,
              fontFamily: T.sans, fontSize: compact ? 11 : 12.5,
              fontWeight: active ? 600 : 500,
              letterSpacing: '-0.01em',
              background: active ? (dark ? '#fff' : T.ink) : 'transparent',
              color: active ? (dark ? T.ink : '#fff') : sub,
              transition: 'all .15s ease',
            }}
          >{TIME_LABEL[t]}</button>
        );
      })}
    </div>
  );
}

// Bottom tab bar (consistent across variants).
function BottomTabs({ accent, dark = false }) {
  const ink = dark ? 'rgba(255,255,255,0.92)' : T.ink;
  const sub = dark ? 'rgba(255,255,255,0.4)' : T.mute;
  const items = [
    { key: 'home',  label: '홈',     active: true },
    { key: 'map',   label: '맛집 지도' },
    { key: 'chat',  label: '채팅' },
    { key: 'me',    label: '나' },
  ];
  return (
    <div style={{
      display: 'flex', justifyContent: 'space-around', alignItems: 'center',
      padding: '10px 12px 14px',
      borderTop: `1px solid ${dark ? 'rgba(255,255,255,0.08)' : T.line}`,
      background: dark ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.6)',
      backdropFilter: 'blur(20px)',
      WebkitBackdropFilter: 'blur(20px)',
      fontFamily: T.sans,
    }}>
      {items.map(i => (
        <div key={i.key} style={{
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
          color: i.active ? ink : sub,
          fontSize: 10.5, fontWeight: i.active ? 600 : 500, letterSpacing: '-0.01em',
        }}>
          <TabIcon kind={i.key} active={i.active} accent={accent} dark={dark} />
          <span>{i.label}</span>
        </div>
      ))}
    </div>
  );
}

function TabIcon({ kind, active, accent, dark }) {
  const c = active ? (dark ? '#fff' : T.ink) : (dark ? 'rgba(255,255,255,0.4)' : T.mute);
  if (kind === 'home') {
    return (
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="4" fill={active ? accent : 'none'} stroke={c} strokeWidth="1.6"/>
      </svg>
    );
  }
  if (kind === 'map') {
    return (
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M3 5l5-2 6 2 5-2v14l-5 2-6-2-5 2V5z" stroke={c} strokeWidth="1.4" strokeLinejoin="round"/>
        <path d="M8 3v14M14 5v14" stroke={c} strokeWidth="1.4"/>
      </svg>
    );
  }
  if (kind === 'chat') {
    return (
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M4 6a3 3 0 013-3h8a3 3 0 013 3v6a3 3 0 01-3 3H9l-4 3v-3a3 3 0 01-1-3V6z" stroke={c} strokeWidth="1.4" strokeLinejoin="round"/>
      </svg>
    );
  }
  return (
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <circle cx="11" cy="8" r="3" stroke={c} strokeWidth="1.4"/>
      <path d="M4 19c1.5-3.5 4.2-5 7-5s5.5 1.5 7 5" stroke={c} strokeWidth="1.4" strokeLinecap="round"/>
    </svg>
  );
}

// Small "note" with monospace explainer used as placeholder.
function Stripe({ w = '100%', h = 60, label }) {
  return (
    <div style={{
      width: w, height: h, borderRadius: 8,
      background:
        'repeating-linear-gradient(45deg, rgba(26,26,28,0.05) 0 6px, rgba(26,26,28,0.02) 6px 12px)',
      border: `1px solid ${T.line}`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: T.mono, fontSize: 10.5, color: T.mute, letterSpacing: '0.04em',
    }}>{label}</div>
  );
}

// ─────────────────────────────────────────────────────────────
// Notification dot for top bar.
// ─────────────────────────────────────────────────────────────
function Bell({ accent, count = 1, dark = false }) {
  return (
    <div style={{
      width: 36, height: 36, borderRadius: '50%',
      background: dark ? 'rgba(255,255,255,0.06)' : 'rgba(26,26,28,0.04)',
      border: dark ? '1px solid rgba(255,255,255,0.06)' : `1px solid ${T.line}`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      position: 'relative',
    }}>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3.5 12V7a4.5 4.5 0 019 0v5M2.5 12h11M6.5 13.5a1.5 1.5 0 003 0" stroke={dark ? '#fff' : T.ink} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      {count > 0 && (
        <div style={{
          position: 'absolute', top: 6, right: 7,
          width: 7, height: 7, borderRadius: '50%',
          background: accent, border: `1.5px solid ${dark ? '#0F0E0D' : '#fff'}`,
        }} />
      )}
    </div>
  );
}

Object.assign(window, {
  T, PERSONA, CONTENT, TIMES, TIME_LABEL, TIME_SYMBOL,
  LionFace, LionMonogram, LionOrb, LionLine, LionWordmark,
  VoicePill, VoiceWave, PersonaStrip, TimeToggle, BottomTabs, TabIcon, Stripe, Bell,
});


// variations.jsx — 5 main-home directions for Lion.
// Each one renders the *inside* of an IOSDevice (status bar + home indicator
// handled by IOSDevice). Width 402 × height 874.

// Status bar already takes ~62px from top — content starts there.
const SAFE_TOP = 62;
const SAFE_BOTTOM = 36;

// ─────────────────────────────────────────────────────────────
// V1 — Quiet Brief (conservative, editorial minimal)
// ─────────────────────────────────────────────────────────────
function V1Quiet({ time, persona }) {
  const c = CONTENT[time];
  const accent = c.accent;
  return (
    <div style={{
      width: '100%', height: '100%', background: T.bg,
      display: 'flex', flexDirection: 'column',
      paddingTop: SAFE_TOP, fontFamily: T.sans, color: T.ink,
    }}>
      {/* Header row */}
      <div style={{ padding: '14px 22px 6px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <LionWordmark accent={accent} />
        <Bell accent={accent} />
      </div>

      {/* Greeting */}
      <div style={{ padding: '18px 22px 0' }}>
        <div style={{
          fontFamily: T.mono, fontSize: 10.5, color: T.mute,
          letterSpacing: '0.08em', textTransform: 'uppercase',
        }}>
          {timestampLabel(time)} · {c.weather.city}
        </div>
        <div style={{
          fontFamily: T.serif, fontSize: 30, lineHeight: 1.2, marginTop: 10,
          fontWeight: 500, letterSpacing: '-0.02em', textWrap: 'pretty',
        }}>
          {c.greetingFor(persona.name)}<span style={{ color: accent }}>.</span>
        </div>
        <div style={{
          fontSize: 14, color: T.ink2, marginTop: 8, lineHeight: 1.55, textWrap: 'pretty',
        }}>{c.line}</div>
      </div>

      {/* Main card — content by time */}
      <div style={{ padding: '20px 16px 8px', flex: 1, overflow: 'hidden' }}>
        <V1Card time={time} c={c} />
      </div>

      {/* Default box */}
      <div style={{ padding: '0 22px 8px' }}>
        <VoicePill accent={accent} />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12 }}>
          <PersonaStrip persona={persona} accent={accent} variant="inline" />
          <a style={{ fontSize: 11.5, color: T.mute, fontFamily: T.mono, letterSpacing: '0.04em' }}>맛집 지도 →</a>
        </div>
      </div>

      <div style={{ paddingBottom: SAFE_BOTTOM }}>
        <BottomTabs accent={accent} />
      </div>
    </div>
  );
}

function V1Card({ time, c }) {
  const wrap = {
    background: T.card, borderRadius: 18, padding: '18px 18px 16px',
    border: `1px solid ${T.line}`, boxShadow: '0 1px 0 rgba(0,0,0,0.02), 0 8px 28px rgba(40,30,15,0.06)',
    height: '100%', display: 'flex', flexDirection: 'column', overflow: 'hidden',
  };
  if (time === 'morning') {
    return (
      <div style={wrap}>
        <CardHeader label={c.label} accent={c.accent} />
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginTop: 12 }}>
          <div style={{ fontFamily: T.serif, fontSize: 44, fontWeight: 500, color: T.ink, letterSpacing: '-0.02em', lineHeight: 1 }}>
            {c.weather.tempHi}<span style={{ fontSize: 22, color: T.mute }}>°</span>
          </div>
          <div style={{ fontSize: 13, color: T.ink2 }}>{c.weather.summary}</div>
          <div style={{ flex: 1 }} />
          <div style={{ fontFamily: T.mono, fontSize: 11, color: T.mute }}>↑{c.weather.tempHi}° ↓{c.weather.tempLo}°</div>
        </div>
        <div style={{ display: 'flex', gap: 6, marginTop: 14, flexWrap: 'wrap' }}>
          {c.outfit.map(o => (
            <span key={o} style={{
              padding: '5px 10px', borderRadius: 999,
              background: 'rgba(200,114,42,0.08)', color: c.accent,
              fontSize: 12, fontWeight: 500,
            }}>{o}</span>
          ))}
        </div>

        <div style={{ height: 1, background: T.line, margin: '16px 0 14px' }} />

        <div style={{ fontSize: 11, color: T.mute, fontFamily: T.mono, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 8 }}>
          오늘 일정 · 3건
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {c.schedule.map((s, i) => (
            <div key={s.title} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
              <div style={{ fontFamily: T.mono, fontSize: 12, color: T.ink2, width: 42, paddingTop: 1 }}>{s.time}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: s.tag ? 600 : 500 }}>{s.title}</div>
                <div style={{ fontSize: 12, color: T.mute, marginTop: 2 }}>{s.meta}</div>
              </div>
              {s.tag && (
                <span style={{ fontSize: 10.5, color: c.accent, fontWeight: 600, marginTop: 2,
                  background: 'rgba(200,114,42,0.10)', padding: '3px 7px', borderRadius: 4 }}>
                  {s.tag}
                </span>
              )}
            </div>
          ))}
        </div>

        <div style={{ flex: 1 }} />
        <div style={{
          marginTop: 14, padding: '10px 12px', borderRadius: 12,
          background: T.paper, display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'rgba(91,124,90,0.14)',
                        display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="5.5" stroke={T.noon} strokeWidth="1.2"/>
              <path d="M7 4v3l2 1" stroke={T.noon} strokeWidth="1.2" strokeLinecap="round"/>
            </svg>
          </div>
          <div style={{ fontSize: 12.5, color: T.ink2, lineHeight: 1.45, flex: 1 }}>
            수면 {c.sleep.hours}시간 {c.sleep.mins}분 · {c.sleep.note}
          </div>
        </div>
      </div>
    );
  }
  if (time === 'noon') {
    const top = c.picks[0];
    return (
      <div style={wrap}>
        <CardHeader label={c.label} accent={c.accent} />
        <div style={{ marginTop: 14 }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 14 }}>
            <Stripe w={66} h={66} label="dish" />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 10.5, color: c.accent, fontWeight: 600, letterSpacing: '0.06em',
                  textTransform: 'uppercase', fontFamily: T.mono }}>{top.tag}</span>
                <span style={{ fontSize: 11, color: T.mute }}>★ {top.rating}</span>
              </div>
              <div style={{ fontFamily: T.serif, fontSize: 22, fontWeight: 500, marginTop: 2, letterSpacing: '-0.01em' }}>
                {top.name}
              </div>
              <div style={{ fontSize: 12, color: T.mute, marginTop: 2 }}>
                {top.kind} · {top.walk} · {top.price}
              </div>
            </div>
          </div>
          <div style={{
            marginTop: 12, padding: '10px 12px', borderRadius: 10,
            background: 'rgba(91,124,90,0.06)', fontSize: 12.5, color: T.ink2, lineHeight: 1.5,
          }}>
            "{top.why}" — 라이언이 골랐어요.
          </div>

          <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
            <button style={{
              flex: 1, padding: '12px 0', border: 0, borderRadius: 12,
              background: c.accent, color: '#fff', fontFamily: T.sans, fontSize: 14, fontWeight: 600,
              cursor: 'pointer', letterSpacing: '-0.01em',

    </div>
  );
}

function CardHeader({ label, accent }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <span style={{ width: 6, height: 6, borderRadius: '50%', background: accent }} />

function timestampLabel(time) {
  return { morning: 'TUE · 06:42', noon: 'TUE · 12:08', evening: 'TUE · 21:36' }[time];

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',');
}
