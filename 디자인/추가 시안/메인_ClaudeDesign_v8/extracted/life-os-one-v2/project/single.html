  :root {
    --bg: #F4F1EC; --ink: #1A1A1C; --ink-2: #3a3a3c; --mute: #8A857C;
    --line: rgba(26,26,28,0.10); --card: #FFFFFF; --paper: #FAF7F1;

<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="lion-shared.jsx"></script>
<script type="text/babel" src="variations.jsx"></script>
<script type="text/babel">
  const params = new URLSearchParams(location.search);
  const v = parseInt(params.get('v') || '1', 10);
  const time = params.get('time') || 'morning';
  const Variants = [V1Quiet, V2Companion, V3Focus, V4Editorial, V5Orb];
  const C = Variants[v - 1] || V1Quiet;
  function Root() {
    return (
      <IOSDevice width={402} height={874}>
        <C time={time} persona={PERSONA} />
      </IOSDevice>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
