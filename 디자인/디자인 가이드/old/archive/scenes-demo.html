<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>라이언 시점 인터랙티브 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0A0A0F; color: white; overflow: hidden;
    font-family: 'Pretendard Variable', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 풀스크린 컨테이너 */
  .stage {
    position: fixed; inset: 0; overflow: hidden;
    transition: background 0.8s ease;
  }

  /* ─── 비 시점 (Morning Rainy) ─────────────────── */
  .stage.rainy {
    background:
      linear-gradient(160deg, #4A5568 0%, #2D3748 50%, #1A202C 100%);
  }
  .stage.rainy .scene-bg::before {
    /* 안개·습기 */
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 60%, rgba(120,150,180,0.35) 0%, transparent 65%),
      radial-gradient(ellipse at 80% 30%, rgba(80,100,130,0.25) 0%, transparent 50%);
    pointer-events: none;
  }

  /* 실제 비 — JS로 동적 생성 */
  .rain-layer {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .drop {
    position: absolute;
    width: 1px;
    background: linear-gradient(180deg, transparent 0%, rgba(220,235,250,0.6) 50%, rgba(220,235,250,0.9) 100%);
    animation: drop-fall linear infinite;
    will-change: transform;
  }
  @keyframes drop-fall {
    0%   { transform: translate3d(0, -120px, 0); }
    100% { transform: translate3d(-30px, 110vh, 0); }
  }

  /* 빗방울 튀김 */
  .splash {
    position: absolute; bottom: 0;
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(220,235,250,0.4);
    animation: splash-pulse ease-out infinite;
    will-change: transform, opacity;
  }
  @keyframes splash-pulse {
    0%   { transform: scale(0); opacity: 0.8; }
    100% { transform: scale(4); opacity: 0; }
  }

  /* ─── 맑은 시점 (Morning Sunny) ─────────────────── */
  .stage.sunny {
    background: linear-gradient(160deg, #FED7AA 0%, #FB923C 35%, #EA580C 70%, #7C2D12 100%);
  }
  .sun {
    position: absolute; top: 14%; right: 12%;
    width: 100px; height: 100px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,253,230,1) 0%, rgba(252,211,77,0.8) 40%, rgba(255,154,0,0.3) 70%, transparent 100%);
    animation: sun-pulse 4s ease-in-out infinite;
    box-shadow: 0 0 80px rgba(255,237,213,0.8), 0 0 160px rgba(255,200,100,0.5);
    will-change: transform, opacity;
  }
  @keyframes sun-pulse {
    0%, 100% { transform: scale(1); opacity: 0.95; }
    50%      { transform: scale(1.08); opacity: 1; }
  }
  .ray {
    position: absolute; top: 15%; right: 14%;
    width: 200px; height: 200px;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,237,213,0.15) 30deg, transparent 60deg, rgba(255,237,213,0.15) 90deg, transparent 120deg, rgba(255,237,213,0.15) 150deg, transparent 180deg, rgba(255,237,213,0.15) 210deg, transparent 240deg, rgba(255,237,213,0.15) 270deg, transparent 300deg, rgba(255,237,213,0.15) 330deg, transparent 360deg);
    border-radius: 50%;
    animation: sun-rotate 30s linear infinite;
    transform-origin: center;
    will-change: transform;
  }
  @keyframes sun-rotate { 100% { transform: rotate(360deg); } }

  .cloud {
    position: absolute;
    width: 120px; height: 30px; border-radius: 50px;
    background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.4) 100%);
    animation: cloud-drift linear infinite;
    will-change: transform;
    filter: blur(2px);
  }
  .cloud::before {
    content: ''; position: absolute; left: 20px; top: -20px;
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.7);
  }
  .cloud::after {
    content: ''; position: absolute; right: 25px; top: -15px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
  }
  @keyframes cloud-drift {
    0%   { transform: translateX(-150px); }
    100% { transform: translateX(calc(100vw + 150px)); }
  }

  /* ─── 점심 시점 (Lunch) ─────────────────── */
  .stage.lunch {
    background:
      radial-gradient(ellipse at center, rgba(150,90,50,0.5) 0%, transparent 60%),
      linear-gradient(135deg, #78350F 0%, #451A03 50%, #1C1917 100%);
  }
  .plate {
    position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
    width: 240px; height: 240px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, #65A30D 0%, #4D7C0F 25%, transparent 38%),
      radial-gradient(circle at 70% 50%, #DC2626 0%, transparent 22%),
      radial-gradient(circle at 50% 75%, #F59E0B 0%, transparent 28%),
      radial-gradient(circle at 20% 70%, #65A30D 0%, transparent 18%),
      radial-gradient(ellipse at center, #2A1810 0%, #1C1108 70%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 -20px 40px rgba(0,0,0,0.4);
    animation: plate-breathe 5s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes plate-breathe {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50%      { transform: translateX(-50%) scale(1.02); }
  }
  .steam {
    position: absolute; top: 28%; left: 50%; transform: translateX(-50%);
    width: 100px; height: 80px;
    background: radial-gradient(ellipse at center bottom, rgba(255,255,255,0.4) 0%, transparent 60%);
    filter: blur(8px);
    animation: steam-rise ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes steam-rise {
    0%   { transform: translateX(-50%) translateY(0) scale(0.8); opacity: 0.6; }
    100% { transform: translateX(-50%) translateY(-60px) scale(1.3); opacity: 0; }
  }

  /* ─── 저녁 시점 (Evening) ─────────────────── */
  .stage.evening {
    background: linear-gradient(180deg, #DC2626 0%, #9F1239 25%, #5B21B6 50%, #1E1B4B 80%, #0F0C29 100%);
    animation: evening-shift 8s ease-in-out infinite;
  }
  @keyframes evening-shift {
    0%, 100% { filter: hue-rotate(0deg) brightness(1); }
    50%      { filter: hue-rotate(-8deg) brightness(0.95); }
  }
  .city-silhouette {
    position: absolute; bottom: 22%; left: 0; right: 0; height: 30%;
    background:
      linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.7) 100%);
    clip-path: polygon(0 60%, 8% 40%, 14% 55%, 22% 30%, 32% 50%, 40% 35%, 50% 55%, 58% 25%, 68% 50%, 78% 35%, 88% 55%, 100% 30%, 100% 100%, 0 100%);
  }
  .window-lights {
    position: absolute; bottom: 22%; left: 0; right: 0; height: 30%;
    pointer-events: none;
  }
  .window {
    position: absolute; width: 3px; height: 3px;
    background: #FCD34D; border-radius: 1px;
    animation: window-flicker ease-in-out infinite;
    box-shadow: 0 0 6px rgba(252,211,77,0.6);
    will-change: opacity;
  }
  @keyframes window-flicker {
    0%, 90%, 100% { opacity: 1; }
    95% { opacity: 0.3; }
  }

  /* ─── 취침 시점 (Night) ─────────────────── */
  .stage.night {
    background: linear-gradient(180deg, #0F0C29 0%, #1E1B4B 30%, #312E81 50%, #1E1B4B 80%, #0A0A0F 100%);
  }
  .star {
    position: absolute; border-radius: 50%; background: white;
    animation: twinkle ease-in-out infinite;
    will-change: opacity, transform;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.4); }
  }
  .moon {
    position: absolute; top: 12%; right: 18%;
    width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #F5F5DC 0%, #D6D5B8 60%, #9CA08F 100%);
    box-shadow: 0 0 40px rgba(245,245,220,0.4), 0 0 80px rgba(245,245,220,0.2);
  }

  /* ─── UI 오버레이 ─────────────────── */
  .ui {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.55) 0%,
      transparent 25%,
      transparent 55%,
      rgba(0,0,0,0.85) 100%);
  }
  .ui > * { pointer-events: auto; }

  .status-bar {
    position: absolute; top: 18px; left: 32px; right: 32px;
    display: flex; justify-content: space-between;
    font-size: 14px; font-weight: 700; color: white;
  }

  .moment-label {
    position: absolute; top: 80px; left: 32px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.85);
    display: flex; align-items: center; gap: 10px;
  }
  .moment-label::before { content: ''; width: 20px; height: 1px; background: rgba(255,255,255,0.6); }

  .hero {
    position: absolute; top: 120px; left: 32px; right: 32px;
  }
  .hero h2 {
    font-size: clamp(28px, 8vw, 44px); font-weight: 800;
    letter-spacing: -0.025em; line-height: 1.15;
    margin: 0; color: white;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }

  .meta {
    position: absolute; bottom: 140px; left: 32px; right: 32px;
  }
  .meta .row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .meta .row:last-child { margin-bottom: 0; }
  .meta .ic { font-size: 18px; }
  .meta .tx { font-size: 15px; color: rgba(255,255,255,0.95); font-weight: 500; }
  .meta .tx b { font-weight: 800; }

  /* FAB */
  .fab {
    position: absolute; bottom: 86px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    display: grid; place-items: center; font-size: 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    border: 0; cursor: pointer;
    animation: fab-pulse 2.5s ease-in-out infinite;
    will-change: transform, box-shadow;
  }
  @keyframes fab-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  /* Bottom nav (scene switcher) */
  .scene-nav {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 12px; border-radius: 999px;
  }
  .scene-btn {
    border: 0; background: transparent;
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 16px; cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.2s;
  }
  .scene-btn:hover { background: rgba(255,255,255,0.1); }
  .scene-btn.active { background: rgba(255,255,255,0.95); }

  /* Help bar */
  .help-bar {
    position: absolute; top: 18px; right: 32px;
    display: flex; gap: 8px;
  }
  .help-btn {
    padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    color: white; font-size: 11px; font-weight: 600;
    cursor: pointer;
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .drop, .splash, .sun, .ray, .cloud, .plate, .steam, .city-silhouette, .window, .star, .stage.evening, .fab {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="stage rainy" id="stage">
  <!-- 배경 동적 요소 -->
  <div class="scene-bg"></div>
  <div class="rain-layer" id="rainLayer"></div>
  <div class="sun" id="sun" style="display:none;"></div>
  <div class="ray" id="ray" style="display:none;"></div>
  <div class="plate" id="plate" style="display:none;"></div>
  <div class="steam" id="steam" style="display:none;"></div>
  <div class="city-silhouette" id="city" style="display:none;"></div>
  <div class="window-lights" id="windowLights" style="display:none;"></div>
  <div class="moon" id="moon" style="display:none;"></div>

  <!-- UI 오버레이 -->
  <div class="ui">
    <div class="status-bar"><span>9:41</span><span>📶 100%</span></div>
    <div class="help-bar">
      <button class="help-btn" onclick="toggleFS()">⛶ Full</button>
    </div>
    <div class="moment-label" id="momentLabel">🌅 Morning</div>
    <div class="hero" id="hero">
      <h2 id="heroText">자켓 · 우산<br>꼭 챙기세요.</h2>
    </div>
    <div class="meta" id="meta">
      <div class="row"><span class="ic">🌧</span><span class="tx">기온 <b>14°</b> · 비 80%</span></div>
      <div class="row"><span class="ic">💼</span><span class="tx"><b>클라이언트 미팅</b> 10:00</span></div>
    </div>
    <button class="fab" aria-label="라이언 호출">🎤</button>
    <div class="scene-nav">
      <button class="scene-btn active" data-scene="rainy" title="비">🌧</button>
      <button class="scene-btn" data-scene="sunny" title="맑음">☀️</button>
      <button class="scene-btn" data-scene="lunch" title="점심">🍱</button>
      <button class="scene-btn" data-scene="evening" title="저녁">🌆</button>
      <button class="scene-btn" data-scene="night" title="취침">🌙</button>
    </div>
  </div>
</div>

<script>
  /* ── 비 drops 생성 ─────────────────────── */
  const rainLayer = document.getElementById('rainLayer');
  const N_DROPS = 140;
  const N_SPLASH = 30;

  function buildRain() {
    rainLayer.innerHTML = '';
    for (let i = 0; i < N_DROPS; i++) {
      const d = document.createElement('div');
      d.className = 'drop';
      const len   = 30 + Math.random() * 50;       // 30~80px 길이
      const dur   = 0.5 + Math.random() * 0.6;     // 0.5~1.1s
      const delay = Math.random() * 1.5;
      const left  = Math.random() * 110;           // -10~110%
      const op    = 0.3 + Math.random() * 0.5;
      d.style.left = left + '%';
      d.style.height = len + 'px';
      d.style.animationDuration = dur + 's';
      d.style.animationDelay = -delay + 's';
      d.style.opacity = op;
      d.style.transform = 'rotate(15deg)';
      rainLayer.appendChild(d);
    }
    for (let i = 0; i < N_SPLASH; i++) {
      const s = document.createElement('div');
      s.className = 'splash';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';
      s.style.animationDelay = -Math.random() * 1 + 's';
      rainLayer.appendChild(s);
    }
  }
  buildRain();

  /* ── 구름 ─────────────────────── */
  function buildClouds() {
    const stage = document.getElementById('stage');
    for (let i = 0; i < 3; i++) {
      const c = document.createElement('div');
      c.className = 'cloud cloud-instance';
      c.style.top = (10 + i * 18) + '%';
      c.style.animationDuration = (40 + i * 15) + 's';
      c.style.animationDelay = -(i * 12) + 's';
      c.style.opacity = 0.5 + Math.random() * 0.3;
      stage.appendChild(c);
    }
  }

  /* ── 도시 window lights ─────────────────────── */
  function buildWindows() {
    const wl = document.getElementById('windowLights');
    wl.innerHTML = '';
    for (let i = 0; i < 60; i++) {
      const w = document.createElement('div');
      w.className = 'window';
      w.style.left = Math.random() * 100 + '%';
      w.style.bottom = (Math.random() * 30) + '%';
      w.style.animationDuration = (3 + Math.random() * 4) + 's';
      w.style.animationDelay = -Math.random() * 5 + 's';
      wl.appendChild(w);
    }
  }

  /* ── 별 ─────────────────────── */
  function buildStars() {
    const stage = document.getElementById('stage');
    // remove old
    stage.querySelectorAll('.star').forEach(s => s.remove());
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 1 + Math.random() * 2.5;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = (5 + Math.random() * 55) + '%';
      s.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
      s.style.animationDelay = -Math.random() * 3 + 's';
      s.style.opacity = 0.3 + Math.random() * 0.7;
      stage.appendChild(s);
    }
  }

  /* ── 시점 전환 ─────────────────────── */
  const scenes = {
    rainy: {
      bg: 'rainy',
      label: '🌅 Morning',
      hero: '자켓 · 우산<br>꼭 챙기세요.',
      meta: [
        { ic: '🌧', tx: '기온 <b>14°</b> · 비 80%' },
        { ic: '💼', tx: '<b>클라이언트 미팅</b> 10:00' }
      ],
      show: ['rainLayer']
    },
    sunny: {
      bg: 'sunny',
      label: '🌅 Morning',
      hero: '가벼운 옷차림<br>딱 좋은 날이에요.',
      meta: [
        { ic: '☀️', tx: '기온 <b>22°</b> · 맑음' },
        { ic: '📅', tx: '오늘 외부 일정 없음' }
      ],
      show: ['sun', 'ray', 'cloud-instance']
    },
    lunch: {
      bg: 'lunch',
      label: '🍱 Lunch',
      hero: '오늘 점심엔<br>닭가슴살 샐러드.',
      meta: [
        { ic: '🥚', tx: '콜레스테롤 관리 · <b>단백질 38g</b>' },
        { ic: '📍', tx: '<b>B카페 강남점</b> · 도보 6분' }
      ],
      show: ['plate', 'steam']
    },
    evening: {
      bg: 'evening',
      label: '🌆 Evening',
      hero: '오늘 하루<br>어떠셨어요?',
      meta: [
        { ic: '🚶', tx: '<b>5,200</b>걸음 · 목표 74%' },
        { ic: '💆', tx: '스트레스 받으셨네요. 매콤 한 그릇 어때요?' }
      ],
      show: ['city', 'windowLights']
    },
    night: {
      bg: 'night',
      label: '🌙 Night',
      hero: '오늘 하루<br>수고하셨어요.',
      meta: [
        { ic: '😴', tx: '취침 권장 <b>23:00</b>' },
        { ic: '📵', tx: '집중 모드 자동 활성화' }
      ],
      show: ['moon', 'star']
    }
  };

  function setScene(name) {
    const stage = document.getElementById('stage');
    stage.className = 'stage ' + name;
    const s = scenes[name];

    document.getElementById('momentLabel').innerHTML = s.label;
    document.getElementById('heroText').innerHTML = s.hero;
    document.getElementById('meta').innerHTML = s.meta.map(m =>
      `<div class="row"><span class="ic">${m.ic}</span><span class="tx">${m.tx}</span></div>`
    ).join('');

    // Hide all dynamic elements
    ['rainLayer','sun','ray','plate','steam','city','windowLights','moon'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    document.querySelectorAll('.cloud-instance').forEach(c => c.style.display = 'none');
    document.querySelectorAll('.star').forEach(c => c.style.display = 'none');

    // Show scene-specific
    s.show.forEach(cls => {
      if (cls === 'cloud-instance') {
        if (!document.querySelector('.cloud-instance')) buildClouds();
        document.querySelectorAll('.cloud-instance').forEach(c => c.style.display = '');
      } else if (cls === 'star') {
        if (!document.querySelector('.star')) buildStars();
        document.querySelectorAll('.star').forEach(c => c.style.display = '');
      } else {
        const el = document.getElementById(cls);
        if (el) el.style.display = '';
      }
    });

    // Update nav
    document.querySelectorAll('.scene-btn').forEach(b => b.classList.toggle('active', b.dataset.scene === name));
  }

  // Bind nav
  document.querySelectorAll('.scene-btn').forEach(b => {
    b.addEventListener('click', () => setScene(b.dataset.scene));
  });

  // Swipe left/right
  let touchX = null;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 60) {
      const order = ['rainy','sunny','lunch','evening','night'];
      const current = document.querySelector('.scene-btn.active').dataset.scene;
      const idx = order.indexOf(current);
      const nextIdx = dx < 0 ? Math.min(idx+1, order.length-1) : Math.max(idx-1, 0);
      setScene(order[nextIdx]);
    }
    touchX = null;
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    const order = ['rainy','sunny','lunch','evening','night'];
    const current = document.querySelector('.scene-btn.active').dataset.scene;
    const idx = order.indexOf(current);
    if (e.key === 'ArrowRight' || e.key === ' ') setScene(order[Math.min(idx+1, order.length-1)]);
    if (e.key === 'ArrowLeft') setScene(order[Math.max(idx-1, 0)]);
    const n = parseInt(e.key);
    if (n >= 1 && n <= 5) setScene(order[n-1]);
  });

  // Fullscreen toggle
  function toggleFS() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
</script>
