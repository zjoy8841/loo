<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>라이언 음성 인터랙션 — 2 Screens</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #050810; color: white;
    font-family: 'Pretendard Variable', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --lion: #E87A3E;
    --lion-glow: #F4B860;
    --teal: #4FD1C5;
    --cyan: #00D4FF;
    --grid: rgba(79,209,197,0.06);
  }

  .page { min-height: 100vh; padding: 40px 32px; }
  .page-title { text-align: center; margin-bottom: 32px; }
  .page-title h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; color: rgba(255,255,255,0.65); margin: 0; }
  .page-title .sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }

  .split {
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
    max-width: 1400px; margin: 0 auto; align-items: start; justify-items: center;
  }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; gap: 32px; } }

  .screen-block { display: flex; flex-direction: column; align-items: center; }
  .screen-label { margin-bottom: 16px; text-align: center; }
  .screen-label .num {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    background: var(--teal); color: #050810;
    font-size: 11px; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 8px;
  }
  .screen-block:nth-child(2) .screen-label .num { background: var(--lion); }
  .screen-label h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .screen-label p { font-size: 12px; color: rgba(255,255,255,0.5); margin: 4px 0 0; font-family: ui-monospace, Menlo, monospace; }

  .phone {
    width: 360px; max-width: 90vw;
    aspect-ratio: 9 / 19.5;
    border-radius: 48px; padding: 12px; background: #1A1A1A;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
  }
  .phone::before {
    content: ''; position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 32px; background: #000; border-radius: 16px; z-index: 20;
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 36px;
    background: radial-gradient(ellipse at center, #0A1929 0%, #050810 70%, #000 100%);
    position: relative; overflow: hidden;
  }

  /* ────── HUD 그리드 (Screen 1만) ────── */
  .screen.has-grid::before {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    pointer-events: none;
  }

  /* ────── 떠다니는 노드 (Screen 1만) ────── */
  .nodes { position: absolute; inset: 0; pointer-events: none; }
  .node {
    position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%;
    background: var(--teal); box-shadow: 0 0 5px var(--teal);
    animation: float 4s ease-in-out infinite, twinkle 3s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(var(--fx, 8px), var(--fy, -8px)); } }
  @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* ────── 상단 라벨 ────── */
  .top-label {
    position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--teal);
    display: flex; align-items: center; gap: 8px;
    z-index: 8; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    transition: color 0.4s;
  }
  .top-label::before, .top-label::after { content: ''; width: 16px; height: 1px; background: currentColor; }

  /* ────── 자비스 ────── */
  .jarvis { position: absolute; pointer-events: none; }
  .jarvis.center {
    top: 50%; left: 50%;
    width: 220px; height: 220px;
    margin-top: -110px; margin-left: -110px;
  }
  .jarvis.bottom-center {
    bottom: 56px; left: 50%;
    width: 88px; height: 88px;
    margin-left: -44px;
    z-index: 10;
  }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--teal); opacity: 0.55; }
  .ring.r1 { border-color: var(--teal) transparent var(--teal) transparent; animation: spin 8s linear infinite; }
  .ring.r2 { inset: 18px; border-color: transparent var(--cyan) transparent var(--cyan); animation: spin 12s linear infinite reverse; }
  .ring.r3 { inset: 38px; border-color: var(--lion-glow) var(--lion-glow) transparent transparent; opacity: 0.6; animation: spin 6s linear infinite; }
  .bottom-center .ring.r2 { inset: 10px; }
  .bottom-center .ring.r3 { inset: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ticks { position: absolute; inset: 0; }
  .tick {
    position: absolute; left: 50%; top: 0;
    width: 1px; height: 6px; background: var(--teal);
    transform-origin: 50% 110px; opacity: 0.35;
  }
  .bottom-center .tick { transform-origin: 50% 44px; height: 4px; }

  .orbit {
    position: absolute; top: 50%; left: 50%;
    width: 190px; height: 190px; margin-top: -95px; margin-left: -95px;
    animation: spin 16s linear infinite;
  }
  .bottom-center .orbit { width: 78px; height: 78px; margin-top: -39px; margin-left: -39px; }
  .orbit .dot {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan), 0 0 16px var(--cyan);
  }
  .bottom-center .orbit .dot { width: 3px; height: 3px; box-shadow: 0 0 5px var(--cyan); }

  .pulse-ring {
    position: absolute; top: 50%; left: 50%;
    width: 80px; height: 80px; margin-top: -40px; margin-left: -40px;
    border-radius: 50%; border: 1px solid var(--teal);
    animation: pulse-out 2.5s ease-out infinite; opacity: 0;
  }
  .pulse-ring:nth-child(5) { animation-delay: 0.6s; }
  .pulse-ring:nth-child(6) { animation-delay: 1.2s; }
  @keyframes pulse-out { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(3); opacity: 0; } }
  .bottom-center .pulse-ring {
    width: 50px; height: 50px; margin-top: -25px; margin-left: -25px;
  }

  /* 코어 */
  .core-glow {
    position: absolute; top: 50%; left: 50%;
    width: 76px; height: 76px; margin-top: -38px; margin-left: -38px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--cyan) 0%, var(--teal) 40%, #0A4F4A 100%);
    box-shadow: 0 0 32px rgba(79,209,197,0.7), 0 0 64px rgba(79,209,197,0.4);
    animation: core-breathe 1.5s ease-in-out infinite;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .bottom-center .core-glow {
    width: 32px; height: 32px; margin-top: -16px; margin-left: -16px;
    box-shadow: 0 0 16px rgba(79,209,197,0.7), 0 0 28px rgba(79,209,197,0.5);
  }
  @keyframes core-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* 자비스 상태별 */
  .screen.thinking .core-glow {
    background: conic-gradient(from 0deg, var(--lion), var(--cyan), var(--teal), var(--lion-glow), var(--lion));
    animation: core-spin 1.2s linear infinite;
  }
  @keyframes core-spin { to { transform: rotate(360deg); } }
  .screen.thinking .top-label { color: var(--lion-glow); }

  .screen.responding .core-glow {
    background: radial-gradient(circle at 30% 30%, var(--lion-glow) 0%, var(--lion) 100%);
    box-shadow: 0 0 24px var(--lion-glow), 0 0 48px var(--lion);
  }
  .screen.responding .top-label { color: var(--lion-glow); }

  /* ─────── Screen 1: 사용자 발화 ─────── */
  .user-typing {
    position: absolute;
    bottom: 80px; left: 50%; transform: translateX(-50%);
    text-align: center; max-width: 86%;
    font-size: 14px; color: rgba(255,255,255,0.65);
    font-family: ui-monospace, Menlo, monospace;
    z-index: 5; min-height: 22px;
  }
  .user-typing::before { content: '"'; opacity: 0.5; }
  .user-typing::after  { content: '"'; opacity: 0.5; }
  .user-typing.empty::before, .user-typing.empty::after { content: ''; }
  .cursor {
    display: inline-block; width: 5px; height: 13px;
    background: var(--teal); vertical-align: middle; margin-left: 4px;
    animation: cursor 1s steps(1) infinite;
  }
  @keyframes cursor { 50% { opacity: 0; } }

  /* ─────── Screen 2: Immersive ─────── */
  /* 배경 이미지 (풀스크린) */
  .bg-image {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 1;
  }
  .bg-image.visible { opacity: 1; }
  .bg-image.fallback {
    background: radial-gradient(ellipse at center, rgba(232,122,62,0.25) 0%, transparent 70%),
                linear-gradient(135deg, #78350F 0%, #451A03 50%, #1C1917 100%);
    display: grid; place-items: center;
  }
  .bg-image.fallback .emo {
    font-size: 180px; filter: drop-shadow(0 0 24px rgba(244,184,96,0.5));
  }

  /* 다크 그라데이션 오버레이 (가독성) */
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.7) 0%,
      rgba(0,0,0,0.35) 20%,
      rgba(0,0,0,0.25) 45%,
      rgba(0,0,0,0.55) 70%,
      rgba(0,0,0,0.9) 100%);
    z-index: 2;
  }

  /* 사용자 발화 (상단, 작게) */
  .imm-user {
    position: absolute;
    top: 108px; left: 50%; transform: translateX(-50%);
    text-align: center; max-width: 86%;
    font-size: 13px; color: rgba(255,255,255,0.7);
    font-family: ui-monospace, Menlo, monospace;
    z-index: 6;
    min-height: 20px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
    opacity: 0;
    transition: opacity 0.5s;
  }
  .imm-user.visible { opacity: 1; }
  .imm-user::before { content: '"'; opacity: 0.55; margin-right: 2px; }
  .imm-user::after  { content: '"'; opacity: 0.55; margin-left: 2px; }
  .imm-user.empty::before, .imm-user.empty::after { content: ''; }
  .imm-user .cursor { background: rgba(255,255,255,0.7); }

  /* AI 응답 (중앙 헤로) */
  .imm-ai {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; width: 86%;
    z-index: 6;
    opacity: 0;
    transition: opacity 0.6s;
  }
  .imm-ai.visible { opacity: 1; }
  .imm-ai h2 {
    font-size: clamp(28px, 7vw, 36px); font-weight: 800;
    letter-spacing: -0.025em; line-height: 1.15;
    margin: 0; color: white;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }

  /* 점 3개 indicator (사용자 발화 직후) */
  .imm-typing {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: none; align-items: center; gap: 8px;
    z-index: 6;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .imm-typing.visible { display: flex; opacity: 1; }
  .imm-typing .d {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--lion-glow);
    box-shadow: 0 0 12px var(--lion-glow);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .imm-typing .d:nth-child(2) { animation-delay: 0.15s; }
  .imm-typing .d:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
    30%           { transform: translateY(-8px) scale(1.15); opacity: 1; }
  }

  /* 데이터 태그 */
  .data-tag {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: rgba(79,209,197,0.5);
    font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.05em;
    z-index: 5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="page-title">
    <h1>라이언 음성 인터랙션</h1>
    <div class="sub">Screen 1 — 음성 인식 중 · Screen 2 — 풀스크린 immersive 응답</div>
  </div>

  <div class="split">

    <!-- ───── Screen 1 ───── -->
    <div class="screen-block">
      <div class="screen-label">
        <div class="num">SCREEN 1</div>
        <h2>음성 인식 중</h2>
        <p>jarvis · center · listening</p>
      </div>
      <div class="phone">
        <div class="screen has-grid" id="screen1">
          <div class="nodes" id="nodes1"></div>
          <div class="top-label" id="label1">🎙 LION · LISTENING</div>

          <div class="jarvis center">
            <div class="ticks" id="ticks1"></div>
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="orbit" id="orbit1"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="core-glow"></div>
          </div>

          <div class="user-typing empty" id="userTyping"><span class="cursor"></span></div>

          <div class="data-tag">STT · ko-KR · 24ms</div>
        </div>
      </div>
    </div>

    <!-- ───── Screen 2 ───── -->
    <div class="screen-block">
      <div class="screen-label">
        <div class="num">SCREEN 2</div>
        <h2>응답 — 풀스크린 immersive</h2>
        <p>full-bleed image · jarvis bottom-center</p>
      </div>
      <div class="phone">
        <div class="screen" id="screen2">
          <!-- 배경 이미지 (응답 시 fade-in) -->
          <div class="bg-image" id="bgImage"></div>

          <!-- 다크 오버레이 -->
          <div class="overlay"></div>

          <!-- 상단 라벨 -->
          <div class="top-label" id="label2">🎙 LION · LISTENING</div>

          <!-- 사용자 발화 (상단) -->
          <div class="imm-user empty" id="immUser"><span class="cursor"></span></div>

          <!-- 점 3개 indicator (Thinking) -->
          <div class="imm-typing" id="immTyping">
            <span class="d"></span><span class="d"></span><span class="d"></span>
          </div>

          <!-- AI 응답 헤로 (중앙) -->
          <div class="imm-ai" id="immAi">
            <h2 id="immAiText"></h2>
          </div>

          <!-- 자비스 (하단 중앙) -->
          <div class="jarvis bottom-center">
            <div class="ticks" id="ticks2"></div>
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="orbit" id="orbit2"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="core-glow"></div>
          </div>

          <div class="data-tag" id="data2Tag">STT · ko-KR · 24ms</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  /* 배경 노드 (Screen 1) */
  const nodesEl = document.getElementById('nodes1');
  for (let i = 0; i < 22; i++) {
    const n = document.createElement('div');
    n.className = 'node';
    n.style.left = Math.random() * 100 + '%';
    n.style.top = Math.random() * 100 + '%';
    n.style.setProperty('--fx', (Math.random() * 16 - 8) + 'px');
    n.style.setProperty('--fy', (Math.random() * 16 - 8) + 'px');
    n.style.animationDuration = (3 + Math.random() * 4) + 's';
    n.style.animationDelay = -Math.random() * 4 + 's';
    nodesEl.appendChild(n);
  }

  /* tick 60개 */
  ['ticks1','ticks2'].forEach(id => {
    const el = document.getElementById(id);
    for (let i = 0; i < 60; i++) {
      const t = document.createElement('div');
      t.className = 'tick';
      t.style.transform = `rotate(${i * 6}deg)`;
      if (i % 5 === 0) { t.style.height = '10px'; t.style.opacity = '0.6'; }
      el.appendChild(t);
    }
  });

  /* orbit */
  function buildOrbit(id, radius) {
    const el = document.getElementById(id);
    for (let i = 0; i < 6; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      const a = (i / 6) * Math.PI * 2;
      d.style.left = `calc(50% + ${Math.cos(a) * radius}px - 2.5px)`;
      d.style.top  = `calc(50% + ${Math.sin(a) * radius}px - 2.5px)`;
      d.style.opacity = (i % 2 === 0) ? '1' : '0.5';
      el.appendChild(d);
    }
  }
  buildOrbit('orbit1', 90);
  buildOrbit('orbit2', 32);

  /* ───── 대화 사이클 ───── */
  const dialogues = [
    { user: '오늘 점심 뭐 먹지?',          ai: '오늘은<br>보쌈 어때요?',       img: 'https://source.unsplash.com/600x900/?bossam,korean,pork',  emo: '🥩' },
    { user: '비 오는데 따뜻한 거.',         ai: '따끈한<br>우동 어떠세요?',     img: 'https://source.unsplash.com/600x900/?udon,noodle',         emo: '🍜' },
    { user: '스트레스 받았어. 매콤한 거.',  ai: '얼큰한<br>김치찌개 어때요?',   img: 'https://source.unsplash.com/600x900/?kimchi,stew,korean',  emo: '🍲' },
    { user: '건강한 거 추천해줘.',          ai: '닭가슴살<br>샐러드 어떠세요?', img: 'https://source.unsplash.com/600x900/?chicken,salad,healthy', emo: '🥗' },
    { user: '고기 먹고 싶어.',              ai: '삼겹살<br>한 판 어떠세요?',    img: 'https://source.unsplash.com/600x900/?samgyeopsal,bbq',     emo: '🥩' },
  ];

  let idx = 0;
  let timeline = [];
  function schedule(fn, ms) { timeline.push(setTimeout(fn, ms)); }
  function clearAll() { timeline.forEach(t => clearTimeout(t)); timeline = []; }

  const screen1 = document.getElementById('screen1');
  const screen2 = document.getElementById('screen2');
  const label1 = document.getElementById('label1');
  const label2 = document.getElementById('label2');
  const userTyping = document.getElementById('userTyping');
  const immUser = document.getElementById('immUser');
  const immTyping = document.getElementById('immTyping');
  const immAi = document.getElementById('immAi');
  const immAiText = document.getElementById('immAiText');
  const bgImage = document.getElementById('bgImage');
  const data2Tag = document.getElementById('data2Tag');

  function setState(state) {
    screen1.classList.remove('thinking','responding');
    screen2.classList.remove('thinking','responding');
    if (state === 'thinking') {
      screen1.classList.add('thinking');
      screen2.classList.add('thinking');
      label1.textContent = '⚙ LION · ANALYZING';
      label2.textContent = '⚙ LION · ANALYZING';
      data2Tag.textContent = 'claude-4.6 · analyzing...';
    } else if (state === 'responding') {
      screen1.classList.add('responding');
      screen2.classList.add('responding');
      label1.textContent = '✨ LION · RESPONSE';
      label2.textContent = '✨ LION · RESPONSE';
      data2Tag.textContent = 'claude-4.6 · 0.8s';
    } else {
      label1.textContent = '🎙 LION · LISTENING';
      label2.textContent = '🎙 LION · LISTENING';
      data2Tag.textContent = 'STT · ko-KR · 24ms';
    }
  }

  function preloadImg(url) {
    return new Promise((resolve) => {
      const i = new Image();
      i.onload = () => resolve(true);
      i.onerror = () => resolve(false);
      i.src = url;
    });
  }

  function turn() {
    const d = dialogues[idx];
    idx = (idx + 1) % dialogues.length;
    const userMs = d.user.length * 60;

    /* 0. reset */
    setState('listening');
    userTyping.classList.add('empty');
    userTyping.innerHTML = '<span class="cursor"></span>';
    immUser.classList.add('empty');
    immUser.classList.remove('visible');
    immUser.innerHTML = '<span class="cursor"></span>';
    immTyping.classList.remove('visible');
    immAi.classList.remove('visible');
    immAiText.innerHTML = '';
    bgImage.classList.remove('visible','fallback');
    bgImage.style.backgroundImage = '';
    bgImage.innerHTML = '';

    /* 이미지 미리 로드 (백그라운드) */
    preloadImg(d.img).then(ok => {
      if (ok) { bgImage.style.backgroundImage = `url("${d.img}")`; bgImage.classList.remove('fallback'); }
      else { bgImage.classList.add('fallback'); bgImage.innerHTML = `<div class="emo">${d.emo}</div>`; }
    });

    /* 1. 사용자 발화 타이핑 — 양쪽 동시 */
    schedule(() => {
      userTyping.classList.remove('empty');
      immUser.classList.remove('empty');
      immUser.classList.add('visible');
      let i = 0;
      function step() {
        if (i < d.user.length) {
          const partial = d.user.slice(0, i+1);
          userTyping.innerHTML = partial + '<span class="cursor"></span>';
          immUser.innerHTML    = partial + '<span class="cursor"></span>';
          i++;
          schedule(step, 60);
        } else {
          userTyping.innerHTML = d.user;
          immUser.innerHTML    = d.user;
        }
      }
      step();
    }, 400);

    /* 2. 사용자 발화 끝 → typing indicator + Thinking */
    const tThinking = 400 + userMs + 600;
    schedule(() => {
      setState('thinking');
      immTyping.classList.add('visible');
    }, tThinking);

    /* 3. AI 응답: 배경 이미지 + 헤로 텍스트 */
    const tResp = tThinking + 1500;
    schedule(() => {
      immTyping.classList.remove('visible');
      setState('responding');
      bgImage.classList.add('visible');
      immAi.classList.add('visible');
      immAiText.innerHTML = d.ai;
    }, tResp);

    /* 4. fade-out */
    const fadeAt = tResp + 3500;
    schedule(() => {
      immUser.classList.remove('visible');
      immAi.classList.remove('visible');
      bgImage.classList.remove('visible');
      userTyping.classList.add('empty');
      userTyping.innerHTML = '<span class="cursor"></span>';
    }, fadeAt);

    /* 5. next */
    schedule(turn, fadeAt + 800);
  }

  schedule(turn, 800);
</script>

</body>
</html>
