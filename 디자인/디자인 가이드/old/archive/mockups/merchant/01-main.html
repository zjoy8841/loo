<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-01 가맹점 · 메인 (대기)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ivory: '#FAF7F0', charcoal: '#1F2937', mustard: '#F59E0B', lavender: '#8B5CF6' }, fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-ivory text-charcoal font-sans min-h-screen">
  <div class="px-4 py-3 bg-white border-b border-gray-200">
    <a href="../index.html" class="text-sm text-gray-500 hover:text-emerald-600">← 인덱스로</a>
  </div>

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-8 py-5 flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl bg-emerald-500 flex items-center justify-center text-white font-bold text-xl">B</div>
      <div class="flex-1">
        <h1 class="text-xl font-bold">B카페 (강남점)</h1>
        <div class="flex items-center gap-2 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <p class="text-xs text-gray-500">영업 중 · 사장님 김민수</p>
        </div>
      </div>
      <button class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-semibold hover:bg-gray-50">설정</button>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-8 py-8 grid grid-cols-3 gap-6">
    <div class="col-span-2 space-y-6">
      <div>
        <h2 class="text-lg font-bold mb-4">📥 새 예약 알림</h2>
        <div class="bg-white rounded-2xl p-12 shadow-sm border-2 border-dashed border-gray-200 text-center">
          <div class="text-5xl mb-3 opacity-30">🔔</div>
          <p class="text-gray-500 font-semibold">대기 중</p>
          <p class="text-sm text-gray-400 mt-1">새 예약이 들어오면 여기서 바로 알려드려요</p>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold">📅 오늘 예약 현황</h2>
          <span class="text-sm text-gray-500">총 3건</span>
        </div>
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-100 flex items-center gap-4">
            <span class="font-mono text-sm text-gray-500 w-14">11:30</span>
            <div class="flex-1">
              <p class="font-semibold text-sm">김OO · 2명</p>
              <p class="text-xs text-gray-500">아메리카노 + 샌드위치 세트</p>
            </div>
            <span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs rounded-full font-semibold">수락됨</span>
          </div>
          <div class="px-5 py-4 border-b border-gray-100 flex items-center gap-4">
            <span class="font-mono text-sm text-gray-500 w-14">12:00</span>
            <div class="flex-1">
              <p class="font-semibold text-sm">이OO · 1명</p>
              <p class="text-xs text-gray-500">닭가슴살 샐러드</p>
            </div>
            <span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs rounded-full font-semibold">수락됨</span>
          </div>
          <div class="px-5 py-4 flex items-center gap-4">
            <span class="font-mono text-sm text-gray-500 w-14">13:30</span>
            <div class="flex-1">
              <p class="font-semibold text-sm">박OO · 3명</p>
              <p class="text-xs text-gray-500">파스타 세트</p>
            </div>
            <span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs rounded-full font-semibold">수락됨</span>
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-6">
      <div>
        <h2 class="text-lg font-bold mb-4">📊 오늘 요약</h2>
        <div class="bg-white rounded-2xl p-5 shadow-sm space-y-4">
          <div class="flex items-baseline justify-between">
            <span class="text-sm text-gray-500">예약</span>
            <div>
              <span class="text-2xl font-bold">3</span>
              <span class="text-sm text-gray-500 ml-1">건</span>
            </div>
          </div>
          <div class="flex items-baseline justify-between border-t border-gray-100 pt-4">
            <span class="text-sm text-gray-500">매출</span>
            <div>
              <span class="text-2xl font-bold">38,500</span>
              <span class="text-sm text-gray-500 ml-1">원</span>
            </div>
          </div>
          <div class="flex items-baseline justify-between border-t border-gray-100 pt-4">
            <span class="text-sm text-gray-500">평균 평점</span>
            <div>
              <span class="text-2xl font-bold">4.7</span>
              <span class="text-sm text-gray-500 ml-1">/ 5.0</span>
            </div>
          </div>
        </div>
      </div>

      <div>
        <h2 class="text-lg font-bold mb-4">🍽️ 메뉴 현황</h2>
        <div class="bg-white rounded-2xl p-5 shadow-sm space-y-2 text-sm">
          <div class="flex justify-between"><span>닭가슴살 샐러드</span><span class="text-emerald-600 font-semibold">판매 중</span></div>
          <div class="flex justify-between"><span>아메리카노</span><span class="text-emerald-600 font-semibold">판매 중</span></div>
          <div class="flex justify-between"><span>크로크무슈</span><span class="text-gray-400">품절</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
