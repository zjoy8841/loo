<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-02 회원가입 1/7 · 계정</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ivory: '#FAF7F0', charcoal: '#1F2937', mustard: '#F59E0B', lavender: '#8B5CF6' }, fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-gray-100 text-charcoal font-sans min-h-screen p-4 sm:p-8">
  <a href="../index.html" class="block max-w-[420px] mx-auto mb-3 text-sm text-gray-500 hover:text-emerald-600">← 인덱스로</a>
  <div class="max-w-[420px] mx-auto bg-ivory rounded-3xl shadow-xl overflow-hidden flex flex-col" style="min-height: 844px;">
    <div class="px-6 pt-6 pb-4 flex items-center justify-between">
      <button class="text-2xl text-gray-500">←</button>
      <span class="text-sm text-gray-500">1 / 7</span>
    </div>
    <div class="px-6">
      <div class="h-1 bg-gray-200 rounded-full overflow-hidden">
        <div class="h-full w-1/7 bg-emerald-500"></div>
      </div>
    </div>
    <div class="flex-1 px-6 pt-8">
      <h1 class="text-2xl font-bold mb-2">계정을 만들어요</h1>
      <p class="text-gray-500 mb-8 text-sm">이메일과 비밀번호로 시작하세요</p>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-2">이름</label>
          <input type="text" placeholder="홍길동" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">이메일</label>
          <input type="email" placeholder="you@example.com" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">비밀번호</label>
          <input type="password" placeholder="8자 이상" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500" />
        </div>
      </div>

      <div class="my-8 flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400">또는 SNS로</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <div class="grid grid-cols-4 gap-3">
        <button onclick="alert('곧 지원 예정이에요')" class="aspect-square rounded-xl bg-yellow-300 flex items-center justify-center text-xl font-bold">K</button>
        <button onclick="alert('곧 지원 예정이에요')" class="aspect-square rounded-xl bg-green-500 flex items-center justify-center text-white text-xl font-bold">N</button>
        <button onclick="alert('곧 지원 예정이에요')" class="aspect-square rounded-xl bg-white border border-gray-200 flex items-center justify-center text-xl font-bold text-blue-500">G</button>
        <button onclick="alert('곧 지원 예정이에요')" class="aspect-square rounded-xl bg-black flex items-center justify-center text-white text-xl"></button>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-gray-200">
      <a href="03-signup-health.html" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-4 rounded-xl text-center transition">다음</a>
    </div>
  </div>
</body>
</html>
